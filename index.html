<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mark Circle Tactics</title>
<style>
body{margin:0;background:#071b26;color:white;font-family:sans-serif}
#app{max-width:920px;margin:auto;padding:8px}
h1{font-size:18px;margin:4px 0 8px}
#field{position:relative;width:100%;aspect-ratio:16/10;background:#0b5d78;border:2px solid white;border-radius:14px;overflow:hidden}
#goal{position:absolute;right:1%;top:36%;width:5%;height:28%;border:2px solid white;background:rgba(255,255,255,.18);display:flex;align-items:center;justify-content:center;font-size:12px}
#judge{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);background:rgba(0,0,0,.72);padding:14px 22px;border-radius:14px;font-size:22px;font-weight:bold;display:none;z-index:10;text-align:center}
.player,.enemy{position:absolute;border-radius:50%;transform:translate(-50%,-50%);display:flex;align-items:center;justify-content:center;font-weight:bold}
.player{width:42px;height:42px;background:#65ccff;color:#06202c;border:2px solid white;z-index:3;font-size:17px}
.owner{background:#ffe45c;box-shadow:0 0 0 5px rgba(255,228,92,.45),0 0 18px #ffe45c}
.selected{box-shadow:0 0 0 5px rgba(120,255,180,.55),0 0 18px #8cffb1}
.owner.selected{background:#ffe45c;box-shadow:0 0 0 5px rgba(255,228,92,.45),0 0 0 9px rgba(120,255,180,.35),0 0 18px #ffe45c}
.enemy{width:28px;height:28px;background:#ef5350;color:white;z-index:2;font-size:12px}
.circle{position:absolute;border-radius:50%;background:rgba(239,83,80,.13);border:2px solid rgba(255,120,120,.75);transform:translate(-50%,-50%)}
.zone{position:absolute;border:1px dashed rgba(255,255,255,.18);top:0;height:100%;width:20%}
#lines{position:absolute;width:100%;height:100%}
button{padding:10px;border-radius:10px;border:0;font-size:15px;font-weight:bold;cursor:pointer}
#targetBox{display:flex;flex-wrap:nowrap;gap:6px;margin-top:12px;margin-bottom:18px;justify-content:center}
#targetBox button{min-width:52px;padding:6px 8px;font-size:13px}
#targetBox button.active{background:#8cffb1;color:#06202c}
#controls{display:grid;grid-template-columns:repeat(3,64px);gap:12px;margin-top:14px;margin-left:auto;margin-right:auto;width:max-content}
#controls button{width:64px;height:56px;font-size:20px;padding:0}
#shootBtn.shot-high{background:#63ff9f;color:#06202c}
#shootBtn.shot-mid{background:#ffe45c;color:#06202c}
.actions{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px;justify-content:flex-end}
.actions button{padding:8px 10px;font-size:13px}
#msg,#status,#roster,#log{margin-top:8px;background:rgba(255,255,255,.12);padding:8px;border-radius:10px;line-height:1.45;font-size:13px;min-height:18px}
#roster{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:4px}
.card{background:rgba(255,255,255,.08);padding:6px;border-radius:8px}
@media (max-width:600px){.player{width:44px;height:44px}.actions{justify-content:flex-end}}
</style>
</head>
<body>
<div id="app">
  <h1>Mark Circle Tactics <span style="font-size:12px;opacity:.75">v12 担当DF・距離制御</span></h1>
  <div id="field"><svg id="lines"></svg><div id="goal">GOAL</div><div id="judge"></div></div>
  <div id="targetBox"></div>
  <div id="controls">
    <button onclick="moveDir(-1,-1)">↖</button><button onclick="moveDir(0,-1)">↑</button><button onclick="moveDir(1,-1)">↗</button>
    <button onclick="moveDir(-1,0)">←</button><button id="shootBtn" onclick="shoot()">シュート</button><button onclick="moveDir(1,0)">→</button>
    <button onclick="moveDir(-1,1)">↙</button><button onclick="moveDir(0,1)">↓</button><button onclick="moveDir(1,1)">↘</button>
  </div>
  <div class="actions">
    <button onclick="resetMatch()">リセット</button><button onclick="rerollTeam()">能力再抽選</button><button onclick="saveTeam()">チーム保存</button><button onclick="loadTeam()">保存チーム</button>
  </div>
  <div id="status"></div><div id="roster"></div><div id="msg"></div><div id="log"></div>
</div>
<script>
const field=document.getElementById("field"),svg=document.getElementById("lines"),msg=document.getElementById("msg"),status=document.getElementById("status"),roster=document.getElementById("roster"),judge=document.getElementById("judge"),logBox=document.getElementById("log"),targetBox=document.getElementById("targetBox"),shootBtn=document.getElementById("shootBtn");
let players=[],enemies=[],owner=0,selected=0,score=0,turn=1,attackLog=[];
let holdTurn=0,holderId=0;
let receivedTurn=0,lastReceiveWasPass=false;
let lastCoverTarget=null,lastMarkTarget=null,lastSwTarget=null;
function rand(min,max){return Math.floor(Math.random()*(max-min+1))+min}
function clamp(v,min,max){return Math.max(min,Math.min(max,v))}
function dist(a,b){return Math.hypot(a.x-b.x,a.y-b.y)}

const basePlayers=[
 {n:"A",role:"司令塔",x:12,y:50,pass:24,shoot:10,one:9,spd:5},
 {n:"B",role:"左サイド",x:30,y:28,pass:19,shoot:15,one:16,spd:8},
 {n:"C",role:"右サイド",x:31,y:72,pass:19,shoot:15,one:16,spd:8},
 {n:"D",role:"ミドル",x:58,y:45,pass:21,shoot:20,one:14,spd:7},
 {n:"E",role:"フィニッシャー",x:78,y:50,pass:15,shoot:28,one:11,spd:6}
];

function makePlayer(b){return {...b,pass:b.pass+rand(-3,3),shoot:b.shoot+rand(-3,3),one:b.one+rand(-2,2),spd:b.spd+rand(-1,1)}}
function createTeam(){players=basePlayers.map(makePlayer)}
function createEnemies(){
 enemies=[
  // 1-2-1気味の初期配置
  {name:"PRESS",x:43,y:50,homeX:43,homeY:50,r:7,def:rand(9,15),role:"press"},
  {name:"COVER",x:58,y:38,homeX:58,homeY:38,r:8,def:rand(10,16),role:"cover"},
  {name:"MARK",x:58,y:62,homeX:58,homeY:62,r:7,def:rand(9,16),role:"mark"},
  {name:"SW",x:74,y:50,homeX:74,homeY:50,r:8,def:rand(10,17),role:"sw"},
  {name:"GK",x:89,y:50,homeX:89,homeY:50,r:10,def:rand(13,20),role:"keeper"}
 ];
}
function resetPositions(){const xs=[12,30,31,58,78],ys=[50,28,72,45,50];players.forEach((p,i)=>{p.x=xs[i];p.y=ys[i]});enemies.forEach(e=>{e.x=e.homeX;e.y=e.homeY})}
function resetMatch(){resetPositions();owner=0;selected=0;score=0;turn=1;attackLog=[];holdTurn=0;holderId=0;receivedTurn=0;lastReceiveWasPass=false;lastCoverTarget=null;lastMarkTarget=null;lastSwTarget=null;msg.textContent="守備を動かして、空いたスペースを探そう。";logBox.innerHTML="";draw()}
function rerollTeam(){createTeam();createEnemies();resetMatch();showJudge("TEAM RESET","能力再抽選",1800)}
function saveTeam(){localStorage.setItem("markCircleTeam",JSON.stringify({players,enemies}));showJudge("SAVE","チーム保存",1800);msg.textContent="現在のチーム能力を保存しました。"}
function loadTeam(){const data=localStorage.getItem("markCircleTeam");if(!data){showJudge("NO DATA","保存なし",2000);msg.textContent="保存チームがありません。";return}const saved=JSON.parse(data);players=saved.players;enemies=saved.enemies;resetMatch();showJudge("LOAD","保存チーム",1800)}
function resetAttackOnly(){resetPositions();owner=0;selected=0;attackLog=[];receivedTurn=0;lastReceiveWasPass=false;holdTurn=0;holderId=0;}
function marks(p){return enemies.filter(e=>e.role!=="keeper"&&dist(p,e)<e.r)}
function lineDef(a,b){let total=0;enemies.forEach(e=>{const dx=b.x-a.x,dy=b.y-a.y,len=dx*dx+dy*dy;if(!len)return;const t=Math.max(0,Math.min(1,((e.x-a.x)*dx+(e.y-a.y)*dy)/len));const px=a.x+t*dx,py=a.y+t*dy;if(Math.hypot(px-e.x,py-e.y)<e.r*.65)total+=e.def});return total}
function receiverRisk(to){
 // 受けた後の危険度。パス成功判定とは分ける。
 const receiveDef=marks(to).reduce((s,e)=>s+e.def,0);
 const finishZoneRisk=to.role==="フィニッシャー"&&to.x>72?8:0;
 const dangerReceiveRisk=to.x>64&&(to.role==="ミドル"||to.role==="フィニッシャー")?6:0;
 return receiveDef+finishZoneRisk+dangerReceiveRisk;
}

function passerPressure(from){
 // 出し手が囲まれているとパス精度が落ちる。ただし重くしすぎない。
 return Math.floor(marks(from).reduce((s,e)=>s+e.def,0)*0.45);
}

function passDifficulty(from,to){
 const distancePenalty=Math.floor(dist(from,to)/4);
 const courseDef=lineDef(from,to);
 const pressure=passerPressure(from);

 // パスが「通るか」は、距離・コース・出し手圧力を中心に見る。
 // 受け手周辺の密集はここでは弱くしか見ない。
 const lightReceive=Math.floor(marks(to).reduce((s,e)=>s+e.def,0)*0.18);

 const total=distancePenalty+courseDef+pressure+lightReceive;

 return{
  distancePenalty,
  courseDef,
  pressure,
  lightReceive,
  receiveRisk:receiverRisk(to),
  total
 };
}

function passColor(from,to){
 const d=passDifficulty(from,to).total;
 if(d<=12)return "#63ff9f";
 if(d<=24)return "#ffe45c";
 return "#ff6b6b";
}

function passTo(i){
 if(i===owner){selected=i;draw();return}
 const from=players[owner],to=players[i],diff=passDifficulty(from,to),attack=from.pass+rand(1,5),defense=diff.total;turn++;
 if(attack>defense){attackLog.push(`${from.n}→${to.n} パス成功`);owner=i;selected=i;holderId=i;holdTurn=0;receivedTurn=turn;lastReceiveWasPass=true;showJudge("PASS SUCCESS","パス成功",1800);msg.textContent=`${from.n}→${to.n} 成功。パス${attack} ＞ 守備${defense} / 受け後リスク${diff.receiveRisk}`;defenseMove("pass");pressureCheck()}
 else{attackLog.push(`${from.n}→${to.n} パス失敗`);showJudge("PASS FAILED","パス失敗",2200);msg.textContent=`カット。パス${attack} ＜ 守備${defense} / 受け後リスク${diff.receiveRisk}`;counterAttack();resetAttackOnly()}
 draw();
}

function moveDir(dx,dy){
 const p=players[selected],len=Math.hypot(dx,dy);if(!len)return;
 const nx=dx/len,ny=dy/len,oldX=p.x,oldY=p.y;p.x=clamp(p.x+nx*p.spd,6,84);p.y=clamp(p.y+ny*p.spd,10,90);turn++;
 if(selected===owner){
  holdTurn=0;
  lastReceiveWasPass=false;
  const contact=marks(p);
  if(contact.length){
   const attack=p.one+rand(0,2),advancePenalty=Math.floor(p.x/25),defense=contact.reduce((s,e)=>s+e.def,0)+advancePenalty;
   if(attack>defense){attackLog.push(`${p.n} 1on1突破`);showJudge("1on1 WIN","突破成功",2000);msg.textContent=`${p.n}突破。1on1 ${attack} ＞ 守備${defense}`;supportMoveAfterDribble();defenseMove("ball")}
   else{p.x=oldX;p.y=oldY;attackLog.push(`${p.n} 1on1失敗`);showJudge("1on1 LOSE","突破失敗",2600);msg.textContent=`止められた。1on1 ${attack} ＜ 守備${defense}`;counterAttack();resetAttackOnly()}
  }else{attackLog.push(`${p.n} ドリブル`);showJudge("DRIBBLE","移動",1400);msg.textContent=`${p.n}がV${p.spd}でドリブル。`;supportMoveAfterDribble();defenseMove("ball")}
 }else{
  attackLog.push(`${p.n} オフボール移動`);showJudge("MOVE","味方移動",1400);msg.textContent=`${p.n}を動かした。危険選手には担当DFがついていく。`;holdTurn++;defenseMove("offball",p);pressureCheck()
 }
 draw();
}

function supportMoveAfterDribble(){
 const ball=players[owner];
 players.forEach((p,i)=>{
  if(i===owner)return;
  if(p.role==="左サイド"){p.x=clamp(p.x+1.6,6,84);p.y=clamp(p.y-1.2,10,90)}
  if(p.role==="右サイド"){p.x=clamp(p.x+1.6,6,84);p.y=clamp(p.y+1.2,10,90)}
  if(p.role==="ミドル"){const targetX=Math.max(ball.x+14,52),targetY=ball.y*.35+50*.65;p.x=clamp(p.x+(targetX-p.x)*.035,50,66);p.y=clamp(p.y+(targetY-p.y)*.025,32,68)}
  if(p.role==="司令塔"){const sideOwner=ball.role==="左サイド"||ball.role==="右サイド";if(sideOwner&&ball.x>35){p.x=clamp(p.x+(ball.x-18-p.x)*.10,6,52);p.y=clamp(p.y+(ball.y-p.y)*.08,20,80)}else{p.x=clamp(p.x-.3,6,84);p.y=clamp(p.y+(50-p.y)*.04,10,90)}}
 });
}

function shotContactDef(shooter){
 const goal={x:96,y:50};let total=0;
 const gx=goal.x-shooter.x,gy=goal.y-shooter.y,glen=Math.hypot(gx,gy)||1,goalDirX=gx/glen,goalDirY=gy/glen;
 marks(shooter).forEach(e=>{const dx=e.x-shooter.x,dy=e.y-shooter.y,dlen=Math.hypot(dx,dy)||1,defDirX=dx/dlen,defDirY=dy/dlen,dot=goalDirX*defDirX+goalDirY*defDirY;let rate=.2;if(dot>.5)rate=1;else if(dot>-.2)rate=.5;total+=Math.floor(e.def*rate)});
 return total;
}
function shotCourseDef(shooter){
 const goal={x:96,y:50};let total=0;
 enemies.forEach(e=>{if(e.role==="keeper")return;const dx=goal.x-shooter.x,dy=goal.y-shooter.y,len=dx*dx+dy*dy;if(!len)return;const t=Math.max(0,Math.min(1,((e.x-shooter.x)*dx+(e.y-shooter.y)*dy)/len)),px=shooter.x+t*dx,py=shooter.y+t*dy,distanceFromLine=Math.hypot(px-e.x,py-e.y);if(t>.05&&t<.95&&distanceFromLine<e.r*.75)total+=Math.floor(e.def*.65)});
 return total;
}
function finishBonus(contactDef,courseDef){
 let bonus=0;

 // 守備を剥がした決定機
 if(contactDef===0)bonus+=1;
 if(courseDef===0)bonus+=1;
 if(contactDef===0 && courseDef===0)bonus+=2;

 // パスを受けてすぐ打つワンタッチ決定機
 if(lastReceiveWasPass && turn-receivedTurn<=1)bonus+=2;

 return bonus;
}

function shotScore(){const p=players[owner],goal={x:96,y:50},distancePenalty=Math.floor(dist(p,goal)/6),contactDef=shotContactDef(p),courseDef=shotCourseDef(p),keeper=enemies.find(e=>e.role==="keeper").def,bonus=finishBonus(contactDef,courseDef);return p.shoot+bonus-distancePenalty-contactDef-courseDef-keeper}
function updateShootButton(){shootBtn.classList.remove("shot-high","shot-mid");const chance=shotScore();if(chance>=4)shootBtn.classList.add("shot-high");else if(chance>=0)shootBtn.classList.add("shot-mid")}
function shoot(){
 const p=players[owner],goal={x:96,y:50},randomBonus=rand(-2,2),distancePenalty=Math.floor(dist(p,goal)/6),contactDef=shotContactDef(p),courseDef=shotCourseDef(p),keeper=enemies.find(e=>e.role==="keeper").def,bonus=finishBonus(contactDef,courseDef),result=p.shoot+randomBonus+bonus-distancePenalty-contactDef-courseDef-keeper;turn++;
 if(result>=0){score++;attackLog.push(`${p.n} シュート成功`);showJudge("SHOT SUCCESS","ゴール",3500);msg.textContent=`ゴール！ ${p.n}：S${p.shoot}+乱数${randomBonus}+決定機${bonus}-距離${distancePenalty}-接触DF${contactDef}-コースDF${courseDef}-GK${keeper} = ${result}`;showAttackLog("ゴールまでの流れ");resetAttackOnly()}
 else{attackLog.push(`${p.n} シュート失敗`);showJudge("SHOT FAILED","シュート失敗",3200);msg.textContent=`失敗。${p.n}：S${p.shoot}+乱数${randomBonus}+決定機${bonus}-距離${distancePenalty}-接触DF${contactDef}-コースDF${courseDef}-GK${keeper} = ${result}`;counterAttack();resetAttackOnly()}
 draw();
}
function counterAttack(){const enemyPower=rand(10,22)+Math.floor(enemies.reduce((s,e)=>s+e.def,0)/9),ourDefense=rand(11,23)+Math.floor(players.reduce((s,p)=>s+p.one+p.spd,0)/17);if(enemyPower>ourDefense){showJudge("COUNTER GOAL","カウンター失点",3500);msg.textContent+=` / カウンター失点：敵${enemyPower} ＞ 味方守備${ourDefense}`}else{showJudge("COUNTER STOP","カウンター阻止",2800);msg.textContent+=` / カウンター阻止：敵${enemyPower} ≤ 味方守備${ourDefense}`}showAttackLog("今回の攻撃")}

function lineBlockPosition(from,to,ratio=.52){
 return {x:from.x*(1-ratio)+to.x*ratio,y:from.y*(1-ratio)+to.y*ratio};
}
function blendPos(a,b,rate){
 return {x:a.x*(1-rate)+b.x*rate,y:a.y*(1-rate)+b.y*rate};
}
function ballDistanceWeight(target){
 const ball=players[owner];
 const d=dist(ball,target);
 if(d>=40)return .85;
 if(d>=28)return .70;
 if(d>=18)return .55;
 return .40;
}
function markTargetPosition(target,kind){
 const ball=players[owner];
 const goalSide=goalSidePosition(target,kind==="E"?.54:.58);
 const passLane=lineBlockPosition(ball,target,.55);
 const watch=ballDistanceWeight(target);
 return {x:goalSide.x*watch+passLane.x*(1-watch),y:goalSide.y*watch+passLane.y*(1-watch)};
}
function pressTargetPosition(attacker,aggression=.78){
 const ball=players[owner];
 const goalCut=goalSidePosition(attacker,.70);
 const ballLane=lineBlockPosition(ball,attacker,.62);
 return blendPos(goalCut,ballLane,1-aggression);
}
function holderPressureBonus(){
 return Math.min(10,holdTurn*2);
}

function pressureCheck(){
 const holder=players[owner];
 const contact=marks(holder);
 const pressure=holderPressureBonus();

 if(!contact.length && pressure<6)return false;

 const nearbyDef=contact.reduce((s,e)=>s+e.def,0);
 const depthPenalty=holder.x>55?Math.floor(holder.x/22):0;
 const attack=holder.one+rand(0,2);
 const defense=nearbyDef+depthPenalty+pressure;

 if(defense>attack+4){
  attackLog.push(`${holder.n} 保持しすぎてロスト`);
  showJudge("PRESS LOST","保持時間で奪われた",3200);
  msg.textContent=`保持プレス。${holder.n}保持${attack} ＜ 守備${defense}。ボールを止めたまま味方を動かしすぎると危険。`;
  counterAttack();
  resetAttackOnly();
  return true;
 }else if(pressure>=6){
  attackLog.push(`${holder.n} 保持プレスを受ける`);
  showJudge("PRESSURE","寄せられている",1800);
  msg.textContent=`保持プレス上昇中。${holder.n}保持${attack} / 守備圧${defense}`;
  return false;
 }

 return false;
}

function showAttackLog(title){logBox.innerHTML=`<b>${title}</b><br>`+(attackLog.length?attackLog.map((x,i)=>`${i+1}. ${x}`).join("<br>"):"記録なし")}
function goalSidePosition(attacker,ratio=.62){const goal={x:96,y:50};return{x:attacker.x*ratio+goal.x*(1-ratio),y:attacker.y*ratio+goal.y*(1-ratio)}}
function threatScore(p,i){
 if(i===owner)return 999;
 let s=0;
 if(p.x>48)s+=p.x-48;
 if(p.role==="ミドル")s+=14;
 if(p.role==="フィニッシャー")s+=18;
 if(p.x>62)s+=16;
 if(Math.abs(p.y-50)<24)s+=10;
 return s;
}
function getThreats(){
 return players.map((p,i)=>({p,i,score:threatScore(p,i)})).filter(t=>t.i!==owner&&t.score>10).sort((a,b)=>b.score-a.score);
}

function delayedTarget(current,last,mode){
 if(mode==="offball" && last)return last;
 return current;
}

function defenseMove(mode="ball",movedPlayer=null){
 const ball=players[owner];
 const dPlayer=players.find(p=>p.role==="ミドル");
 const ePlayer=players.find(p=>p.role==="フィニッシャー");
 const pressureBoost=holderPressureBonus();

 enemies.forEach(e=>{
  if(e.role==="keeper"){
   e.x=clamp(89+(ball.x-70)*.08,86,92);
   e.y=clamp(50+(ball.y-50)*.30,34,66);
   return;
  }

  let tx=e.homeX,ty=e.homeY,react=.22;

  // PRESS：ボール保持者へ詰める。保持が長いほど強く詰める。
  if(e.role==="press"){
   const cut=pressTargetPosition(ball,.82);
   tx=cut.x;ty=cut.y;
   react=mode==="ball"?.50:(mode==="pass"?.38:.34);
   react+=Math.min(.14,pressureBoost*.01);
  }

  // COVER：D担当。Dが危険ならDへのパスレーンを切る。
  // C/Bがボール保持なら、C/B→Dの間に入りやすくする。
  if(e.role==="cover"){
   if(dPlayer && dPlayer.x>48){
    let pos=markTargetPosition(dPlayer,"D");
    if(ball.role==="右サイド" || ball.role==="左サイド"){
     const lane=lineBlockPosition(ball,dPlayer,.55);
     pos=blendPos(pos,lane,.45);
    }
    tx=pos.x;ty=pos.y;
    react=mode==="offball"?.34:(mode==="pass"?.34:.42);
   }else{
    tx=e.homeX;ty=e.homeY;
    react=mode==="offball"?.18:.22;
   }
  }

  // MARK：E担当。ボールが遠いほどEを見る。近い時はパスレーンを切る。
  if(e.role==="mark"){
   if(ePlayer && ePlayer.x>50){
    const pos=markTargetPosition(ePlayer,"E");
    tx=pos.x;ty=pos.y;
    if(ePlayer.x>70){
     react=mode==="offball"?.50:(mode==="pass"?.42:.46);
    }else{
     react=mode==="offball"?.38:(mode==="pass"?.34:.38);
    }
   }else{
    tx=e.homeX;ty=e.homeY;
    react=mode==="offball"?.20:.24;
   }
  }

  // SW：カバー。ゴール前に吸われすぎず、中間管理。
  if(e.role==="sw"){
   let target=dPlayer;
   if(ePlayer && ePlayer.x>68)target=ePlayer;
   if(ball.x>65)target=ball;

   if(target){
    const goalCut=goalSidePosition(target,.48);
    const central={x:72,y:50};
    const pos=blendPos(goalCut,central,.35);
    tx=pos.x;ty=pos.y;
   }else{
    tx=e.homeX;ty=e.homeY;
   }

   react=mode==="offball"?.20:(mode==="pass"?.24:.30);
  }

  e.x+=(tx-e.x)*react;
  e.y+=(ty-e.y)*react;
  e.x=clamp(e.x,8,88);
  e.y=clamp(e.y,8,92);
 });
}

function showJudge(main,sub,duration=1600){judge.innerHTML=`${main}<br><small>${sub}</small>`;judge.style.display="block";clearTimeout(showJudge.timer);showJudge.timer=setTimeout(()=>{judge.style.display="none"},duration)}
function draw(){
 field.querySelectorAll(".player,.enemy,.circle,.zone").forEach(e=>e.remove());svg.innerHTML="";
 targetBox.innerHTML=players.map((p,i)=>`<button class="${i===selected?'active':''}" onclick="selected=${i};draw()">選択 ${p.n}</button>`).join("");
 for(let i=0;i<5;i++){const z=document.createElement("div");z.className="zone";z.style.left=(i*20)+"%";field.appendChild(z)}
 enemies.forEach(e=>{const c=document.createElement("div");c.className="circle";c.style.left=e.x+"%";c.style.top=e.y+"%";c.style.width=e.r*2+"%";c.style.aspectRatio="1";field.appendChild(c);const b=document.createElement("div");b.className="enemy";b.style.left=e.x+"%";b.style.top=e.y+"%";b.textContent=e.role==="keeper"?"GK"+e.def:e.def;field.appendChild(b)});
 players.forEach((p,i)=>{if(i!==owner){const l=document.createElementNS("http://www.w3.org/2000/svg","line");l.setAttribute("x1",players[owner].x+"%");l.setAttribute("y1",players[owner].y+"%");l.setAttribute("x2",p.x+"%");l.setAttribute("y2",p.y+"%");l.setAttribute("stroke",passColor(players[owner],p));l.setAttribute("stroke-width","4");svg.appendChild(l)}});
 players.forEach((p,i)=>{
 if(i!==owner){
  const risk=receiverRisk(p);
  if(risk>=18){
   const r=document.createElement("div");
   r.className="circle";
   r.style.left=p.x+"%";
   r.style.top=p.y+"%";
   r.style.width="10%";
   r.style.aspectRatio="1";
   r.style.borderColor=risk>=30?"rgba(255,80,80,.95)":"rgba(255,228,92,.9)";
   r.style.background=risk>=30?"rgba(255,80,80,.12)":"rgba(255,228,92,.10)";
   field.appendChild(r);
  }
 }
 const el=document.createElement("button");
 el.className="player "+(i===owner?"owner ":"")+(i===selected?"selected":"");
 el.style.left=p.x+"%";
 el.style.top=p.y+"%";
 el.textContent=p.n;
 el.onclick=()=>passTo(i);
 field.appendChild(el);
});
 status.innerHTML=`得点：${score}　ターン：${turn}　ボール保持：${players[owner].n} ${players[owner].role}　選択中：${players[selected].n}<br>v12: 担当DF距離制御 / 保持プレス蓄積 / パスレーン遮断強化`;
 roster.innerHTML=players.map(p=>`<div class="card"><b>${p.n} ${p.role}</b><br>P${p.pass} / S${p.shoot} / O${p.one} / V${p.spd}</div>`).join("")+`<div class="card"><b>GK</b><br>守備 ${enemies.find(e=>e.role==="keeper").def}</div>`;
 updateShootButton();
}
window.addEventListener("error",e=>{msg.textContent="エラー："+e.message});
createTeam();createEnemies();resetMatch();
</script>
