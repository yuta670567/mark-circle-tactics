<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Mark Circle Tactics</title>
<style>
body{margin:0;background:#071b26;color:white;font-family:sans-serif}#app{max-width:920px;margin:auto;padding:8px}h1{font-size:18px;margin:4px 0 8px}#field{position:relative;width:100%;aspect-ratio:16/10;background:#0b5d78;border:2px solid #fff;border-radius:14px;overflow:hidden}#lines{position:absolute;width:100%;height:100%;left:0;top:0}.zone{position:absolute;top:0;height:100%;width:20%;border-left:1px dashed rgba(255,255,255,.18)}#goal{position:absolute;right:1%;top:36%;width:5%;height:28%;border:2px solid #fff;background:rgba(255,255,255,.18);display:flex;align-items:center;justify-content:center;font-size:12px}.player,.enemy{position:absolute;border-radius:50%;transform:translate(-50%,-50%);display:flex;align-items:center;justify-content:center;font-weight:bold}.player{width:42px;height:42px;background:#65ccff;color:#06202c;border:2px solid #fff;z-index:3;font-size:17px}.owner{background:#ffe45c;box-shadow:0 0 0 5px rgba(255,228,92,.45),0 0 18px #ffe45c}.selected{box-shadow:0 0 0 5px rgba(120,255,180,.55),0 0 18px #8cffb1}.owner.selected{background:#ffe45c;box-shadow:0 0 0 5px rgba(255,228,92,.45),0 0 0 9px rgba(120,255,180,.35),0 0 18px #ffe45c}.enemy{width:28px;height:28px;background:#ef5350;color:#fff;z-index:2;font-size:12px}.circle{position:absolute;border-radius:50%;background:rgba(239,83,80,.13);border:2px solid rgba(255,120,120,.75);transform:translate(-50%,-50%)}#judge{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);background:rgba(0,0,0,.72);padding:14px 22px;border-radius:14px;font-size:22px;font-weight:bold;display:none;z-index:10;text-align:center}button{padding:10px;border-radius:10px;border:0;font-size:15px;font-weight:bold;cursor:pointer}#targetBox{display:flex;flex-wrap:nowrap;gap:6px;margin-top:12px;margin-bottom:18px;justify-content:center}#targetBox button{min-width:52px;padding:6px 8px;font-size:13px}#targetBox button.active{background:#8cffb1;color:#06202c}#controls{display:grid;grid-template-columns:repeat(3,64px);gap:12px;margin:14px auto 0;width:max-content}#controls button{width:64px;height:56px;font-size:20px;padding:0}#shootBtn.shot-high{background:#63ff9f;color:#06202c}#shootBtn.shot-mid{background:#ffe45c;color:#06202c}.actions{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px;justify-content:flex-end}.actions button{padding:8px 10px;font-size:13px}#msg,#status,#roster,#log{margin-top:8px;background:rgba(255,255,255,.12);padding:8px;border-radius:10px;line-height:1.45;font-size:13px;min-height:18px}#roster{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:4px}.card{background:rgba(255,255,255,.08);padding:6px;border-radius:8px}@media(max-width:600px){.player{width:44px;height:44px}.actions{justify-content:flex-end}}
</style>
</head>
<body>
<div id="app"><h1>Mark Circle Tactics</h1><div id="field"><svg id="lines"></svg><div id="goal">GOAL</div><div id="judge"></div></div><div id="targetBox"></div><div id="controls"><button onclick="moveDir(-1,-1)">↖</button><button onclick="moveDir(0,-1)">↑</button><button onclick="moveDir(1,-1)">↗</button><button onclick="moveDir(-1,0)">←</button><button id="shootBtn" onclick="shoot()">シュート</button><button onclick="moveDir(1,0)">→</button><button onclick="moveDir(-1,1)">↙</button><button onclick="moveDir(0,1)">↓</button><button onclick="moveDir(1,1)">↘</button></div><div class="actions"><button onclick="resetMatch()">リセット</button><button onclick="rerollTeam()">能力再抽選</button><button onclick="saveTeam()">チーム保存</button><button onclick="loadTeam()">保存チーム</button></div><div id="status"></div><div id="roster"></div><div id="msg"></div><div id="log"></div></div>
<script>
const field=document.getElementById('field'),svg=document.getElementById('lines'),msg=document.getElementById('msg'),status=document.getElementById('status'),roster=document.getElementById('roster'),judge=document.getElementById('judge'),logBox=document.getElementById('log'),targetBox=document.getElementById('targetBox'),shootBtn=document.getElementById('shootBtn');let players=[],enemies=[],owner=0,selected=0,score=0,turn=1,attackLog=[];
function rand(a,b){return Math.floor(Math.random()*(b-a+1))+a}function clamp(v,a,b){return Math.max(a,Math.min(b,v))}function dist(a,b){return Math.hypot(a.x-b.x,a.y-b.y)}
const basePlayers=[{n:'A',role:'司令塔',x:12,y:50,pass:24,shoot:10,one:9,spd:5},{n:'B',role:'左サイド',x:30,y:28,pass:19,shoot:15,one:16,spd:8},{n:'C',role:'右サイド',x:31,y:72,pass:19,shoot:15,one:16,spd:8},{n:'D',role:'ミドル',x:58,y:45,pass:21,shoot:20,one:14,spd:7},{n:'E',role:'フィニッシャー',x:78,y:50,pass:15,shoot:28,one:11,spd:6}];
function makePlayer(b){return {...b,pass:b.pass+rand(-3,3),shoot:b.shoot+rand(-3,3),one:b.one+rand(-2,2),spd:b.spd+rand(-1,1)}}function createTeam(){players=basePlayers.map(makePlayer)}
function createEnemies(){enemies=[{name:'DMF',x:42,y:50,homeX:42,homeY:50,r:7,def:rand(7,14),role:'dmf'},{name:'LCB',x:60,y:34,homeX:60,homeY:34,r:7,def:rand(8,15),role:'lcb'},{name:'RCB',x:60,y:66,homeX:60,homeY:66,r:7,def:rand(8,15),role:'rcb'},{name:'SW',x:75,y:50,homeX:75,homeY:50,r:8,def:rand(9,16),role:'sw'},{name:'GK',x:89,y:50,homeX:89,homeY:50,r:10,def:rand(13,20),role:'keeper'}]}
function resetPositions(){[12,30,31,58,78].forEach((x,i)=>players[i].x=x);[50,28,72,45,50].forEach((y,i)=>players[i].y=y);enemies.forEach(e=>{e.x=e.homeX;e.y=e.homeY})}function resetMatch(){resetPositions();owner=0;selected=0;score=0;turn=1;attackLog=[];msg.textContent='守備を動かして、空いたスペースを探そう。';logBox.innerHTML='';draw()}function rerollTeam(){createTeam();createEnemies();resetMatch();showJudge('TEAM RESET','能力再抽選',1800)}function saveTeam(){localStorage.setItem('markCircleTeam',JSON.stringify({players,enemies}));showJudge('SAVE','チーム保存',1800);msg.textContent='現在のチーム能力を保存しました。'}function loadTeam(){const d=localStorage.getItem('markCircleTeam');if(!d){showJudge('NO DATA','保存なし',2000);return}const s=JSON.parse(d);players=s.players;enemies=s.enemies;resetMatch();showJudge('LOAD','保存チーム',1800)}function resetAttackOnly(){resetPositions();owner=0;selected=0;attackLog=[]}
function marks(p){return enemies.filter(e=>e.role!=='keeper'&&dist(p,e)<e.r)}function lineDef(a,b){let total=0;enemies.forEach(e=>{const dx=b.x-a.x,dy=b.y-a.y,len=dx*dx+dy*dy;if(!len)return;const t=Math.max(0,Math.min(1,((e.x-a.x)*dx+(e.y-a.y)*dy)/len));const px=a.x+t*dx,py=a.y+t*dy;if(Math.hypot(px-e.x,py-e.y)<e.r*.65)total+=e.def});return total}function passDifficulty(f,t){const d=Math.floor(dist(f,t)/4),c=lineDef(f,t),r=marks(t).reduce((s,e)=>s+e.def,0),z=t.role==='フィニッシャー'&&t.x>72?8:0;return{total:d+c+r+z,distancePenalty:d,courseDef:c,receiveDef:r,finishZonePenalty:z}}function passColor(f,t){const d=passDifficulty(f,t).total;return d<=12?'#63ff9f':d<=24?'#ffe45c':'#ff6b6b'}
function passTo(i){if(i===owner){selected=i;draw();return}const f=players[owner],t=players[i],df=passDifficulty(f,t),atk=f.pass+rand(1,5),def=df.total;turn++;if(atk>def){attackLog.push(`${f.n}→${t.n} パス成功`);owner=i;selected=i;showJudge('PASS SUCCESS','パス成功',1800);msg.textContent=`${f.n}→${t.n} 成功。パス${atk} ＞ 守備${def}`;defenseMove('pass')}else{attackLog.push(`${f.n}→${t.n} パス失敗`);showJudge('PASS FAILED','パス失敗',2200);msg.textContent=`カット。パス${atk} ＜ 守備${def}`;counterAttack();resetAttackOnly()}draw()}
function moveDir(dx,dy){const p=players[selected],len=Math.hypot(dx,dy);if(!len)return;const ox=p.x,oy=p.y;p.x=clamp(p.x+dx/len*p.spd,6,84);p.y=clamp(p.y+dy/len*p.spd,10,90);turn++;if(selected===owner){const m=marks(p);if(m.length){const atk=p.one+rand(0,2),def=m.reduce((s,e)=>s+e.def,0)+Math.floor(p.x/25);if(atk>def){attackLog.push(`${p.n} 1on1突破`);showJudge('1on1 WIN','突破成功',2000);supportMoveAfterDribble();defenseMove('ball')}else{p.x=ox;p.y=oy;attackLog.push(`${p.n} 1on1失敗`);showJudge('1on1 LOSE','突破失敗',2600);counterAttack();resetAttackOnly()}}else{attackLog.push(`${p.n} ドリブル`);showJudge('DRIBBLE','移動',1400);supportMoveAfterDribble();defenseMove('ball')}}else{attackLog.push(`${p.n} オフボール移動`);showJudge('MOVE','味方移動',1400);defenseMove('offball',p)}draw()}
function supportMoveAfterDribble(){
  const b=players[owner];

  players.forEach((p,i)=>{
    if(i===owner)return;

    if(p.role==='左サイド'){
      p.x=clamp(p.x+1.6,6,84);
      p.y=clamp(p.y-1.2,10,90);
    }

    if(p.role==='右サイド'){
      p.x=clamp(p.x+1.6,6,84);
      p.y=clamp(p.y+1.2,10,90);
    }

    // DはAに寄りすぎず、中央〜やや前方の中継点に残る
    if(p.role==='ミドル'){
      const targetX=Math.max(b.x+18,54);
      const targetY=b.y*0.45+50*0.55;
      p.x=clamp(p.x+(targetX-p.x)*0.08,48,70);
      p.y=clamp(p.y+(targetY-p.y)*0.06,28,72);
    }

    // B/Cが運んだら、Aは後方の戻し先として少し追い上げる
    if(p.role==='司令塔'){
      const sideOwner=b.role==='左サイド'||b.role==='右サイド';
      if(sideOwner && b.x>35){
        p.x=clamp(p.x+(b.x-18-p.x)*0.10,6,52);
        p.y=clamp(p.y+(b.y-p.y)*0.08,20,80);
      }else{
        p.x=clamp(p.x-0.3,6,84);
        p.y=clamp(p.y+(50-p.y)*0.04,10,90);
      }
    }
  });
}
function shotContactDef(shooter){
  const goal={x:96,y:50};
  let total=0;

  const gx=goal.x-shooter.x;
  const gy=goal.y-shooter.y;
  const glen=Math.hypot(gx,gy)||1;
  const goalDirX=gx/glen;
  const goalDirY=gy/glen;

  marks(shooter).forEach(e=>{
    const dx=e.x-shooter.x;
    const dy=e.y-shooter.y;
    const dlen=Math.hypot(dx,dy)||1;
    const defDirX=dx/dlen;
    const defDirY=dy/dlen;

    // 1に近いほどゴール側、0付近は横、-1は背後
    const dot=goalDirX*defDirX+goalDirY*defDirY;

    let rate=0.2;
    if(dot>0.5)rate=1.0;
    else if(dot>-0.2)rate=0.5;

    total+=Math.floor(e.def*rate);
  });

  return total;
}

function shotCourseDef(shooter){
  const goal={x:96,y:50};
  let total=0;

  enemies.forEach(e=>{
    if(e.role==='keeper')return;

    const dx=goal.x-shooter.x;
    const dy=goal.y-shooter.y;
    const len=dx*dx+dy*dy;
    if(len===0)return;

    const t=Math.max(0,Math.min(1,((e.x-shooter.x)*dx+(e.y-shooter.y)*dy)/len));
    const px=shooter.x+t*dx;
    const py=shooter.y+t*dy;
    const distanceFromLine=Math.hypot(px-e.x,py-e.y);

    // シューターとゴールの間、かつシュートライン付近にいるDFだけ反映
    if(t>0.05 && t<0.95 && distanceFromLine<e.r*0.75){
      total+=Math.floor(e.def*0.65);
    }
  });

  return total;
}

function shotScore(){
  const p=players[owner];
  const g={x:96,y:50};
  const d=Math.floor(dist(p,g)/6);
  const m=shotContactDef(p);
  const c=shotCourseDef(p);
  const k=enemies.find(e=>e.role==='keeper').def;
  return p.shoot-d-m-c-k;
}

function updateShootButton(){
  shootBtn.classList.remove('shot-high','shot-mid');
  const c=shotScore();
  if(c>=4)shootBtn.classList.add('shot-high');
  else if(c>=0)shootBtn.classList.add('shot-mid');
}

function shoot(){
  const p=players[owner];
  const g={x:96,y:50};
  const r=rand(-2,2);
  const d=Math.floor(dist(p,g)/6);
  const m=shotContactDef(p);
  const c=shotCourseDef(p);
  const k=enemies.find(e=>e.role==='keeper').def;
  const res=p.shoot+r-d-m-c-k;

  turn++;

  if(res>=0){
    score++;
    attackLog.push(`${p.n} シュート成功`);
    showJudge('SHOT SUCCESS','ゴール',3500);
    msg.textContent=`ゴール！ ${p.n}：S${p.shoot}+補正${r}-距離${d}-接触DF${m}-コースDF${c}-GK${k} = ${res}`;
    showAttackLog('ゴールまでの流れ');
    resetAttackOnly();
  }else{
    attackLog.push(`${p.n} シュート失敗`);
    showJudge('SHOT FAILED','シュート失敗',3200);
    msg.textContent=`失敗。${p.n}：S${p.shoot}+補正${r}-距離${d}-接触DF${m}-コースDF${c}-GK${k} = ${res}`;
    counterAttack();
    resetAttackOnly();
  }

  draw();
}

function counterAttack(){const e=rand(10,22)+Math.floor(enemies.reduce((s,x)=>s+x.def,0)/9),o=rand(11,23)+Math.floor(players.reduce((s,p)=>s+p.one+p.spd,0)/17);if(e>o){showJudge('COUNTER GOAL','カウンター失点',3500);msg.textContent+=` / カウンター失点：敵${e} ＞ 味方守備${o}`}else{showJudge('COUNTER STOP','カウンター阻止',2800);msg.textContent+=` / カウンター阻止：敵${e} ≤ 味方守備${o}`}showAttackLog('今回の攻撃')}function showAttackLog(t){logBox.innerHTML=`<b>${t}</b><br>`+(attackLog.length?attackLog.map((x,i)=>`${i+1}. ${x}`).join('<br>'):'記録なし')}
function mostDangerousRunner(){return players.map((p,i)=>({p,i})).filter(x=>x.i!==owner&&x.p.x>45).sort((a,b)=>b.p.x+(100-Math.abs(b.p.y-50))*.25-a.p.x-(100-Math.abs(a.p.y-50))*.25)[0]?.p}function defenseMove(mode='ball',mp=null){const b=players[owner],r=mostDangerousRunner(),danger=b.x>65;enemies.forEach(e=>{if(e.role==='keeper'){e.x=clamp(89+(b.x-70)*.08,86,92);e.y=clamp(50+(b.y-50)*.35,34,66);return}let tx=e.homeX,ty=e.homeY,react=.24;if(e.role==='dmf'){tx=e.homeX*.25+b.x*.75;ty=e.homeY*.25+b.y*.75;react=mode==='ball'?.40:.24;if(r){tx=tx*.70+r.x*.30;ty=ty*.70+r.y*.30}if(mode==='offball'&&mp&&mp.x>40){tx=tx*.62+mp.x*.38;ty=ty*.62+mp.y*.38;react=.32}}if(e.role==='lcb'){tx=60;ty=b.y<50?38:34;if(r&&r.y<55){tx=tx*.78+r.x*.22;ty=ty*.78+r.y*.22}if(danger&&b.y<50){tx=b.x;ty=b.y;react=.46}else react=mode==='offball'?.18:.28}if(e.role==='rcb'){tx=60;ty=b.y>50?62:66;if(r&&r.y>45){tx=tx*.78+r.x*.22;ty=ty*.78+r.y*.22}if(danger&&b.y>=50){tx=b.x;ty=b.y;react=.46}else react=mode==='offball'?.18:.28}if(e.role==='sw'){tx=75;ty=(b.y+50)/2;if(r){tx=tx*.72+r.x*.28;ty=ty*.72+r.y*.28}if(danger){tx=b.x+5;ty=b.y*.35+50*.65;react=.30}else react=mode==='offball'?.18:.26}e.x+=(tx-e.x)*react;e.y+=(ty-e.y)*react;e.x=clamp(e.x,8,88);e.y=clamp(e.y,8,92)})}
function showJudge(a,b,d=1600){judge.innerHTML=`${a}<br><small>${b}</small>`;judge.style.display='block';clearTimeout(showJudge.timer);showJudge.timer=setTimeout(()=>judge.style.display='none',d)}
function draw(){field.querySelectorAll('.player,.enemy,.circle,.zone').forEach(e=>e.remove());svg.innerHTML='';targetBox.innerHTML=players.map((p,i)=>`<button class="${i===selected?'active':''}" onclick="selected=${i};draw()">選択 ${p.n}</button>`).join('');for(let i=0;i<5;i++){const z=document.createElement('div');z.className='zone';z.style.left=i*20+'%';field.appendChild(z)}enemies.forEach(e=>{const c=document.createElement('div');c.className='circle';c.style.left=e.x+'%';c.style.top=e.y+'%';c.style.width=e.r*2+'%';c.style.aspectRatio='1';field.appendChild(c);const b=document.createElement('div');b.className='enemy';b.style.left=e.x+'%';b.style.top=e.y+'%';b.textContent=e.role==='keeper'?'GK'+e.def:e.def;field.appendChild(b)});players.forEach((p,i)=>{if(i!==owner){const l=document.createElementNS('http://www.w3.org/2000/svg','line');l.setAttribute('x1',players[owner].x+'%');l.setAttribute('y1',players[owner].y+'%');l.setAttribute('x2',p.x+'%');l.setAttribute('y2',p.y+'%');l.setAttribute('stroke',passColor(players[owner],p));l.setAttribute('stroke-width','4');svg.appendChild(l)}});players.forEach((p,i)=>{const el=document.createElement('button');el.className='player '+(i===owner?'owner ':'')+(i===selected?'selected':'');el.style.left=p.x+'%';el.style.top=p.y+'%';el.textContent=p.n;el.onclick=()=>passTo(i);field.appendChild(el)});status.innerHTML=`得点：${score}　ターン：${turn}　ボール保持：${players[owner].n} ${players[owner].role}　選択中：${players[selected].n}<br>緑=安全パス / 黄=注意 / 赤=危険　シュートボタン：緑=好機 / 黄=狙える / 通常=まだ早い`;roster.innerHTML=players.map(p=>`<div class="card"><b>${p.n} ${p.role}</b><br>P${p.pass} / S${p.shoot} / O${p.one} / V${p.spd}</div>`).join('')+`<div class="card"><b>GK</b><br>守備 ${enemies.find(e=>e.role==='keeper').def}</div>`;updateShootButton()}
window.addEventListener('error',e=>{msg.textContent='エラー：'+e.message});createTeam();createEnemies();resetMatch();
</script>
</body>
</html>
