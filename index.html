<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mark Circle Tactics</title>
<style>
body{margin:0;background:#071b26;color:white;font-family:sans-serif}
#app{max-width:920px;margin:auto;padding:8px}
h1{font-size:18px;margin:4px 0 8px}
#field{position:relative;width:100%;aspect-ratio:16/10;background:#0b5d78;border:2px solid white;border-radius:14px;overflow:hidden}
#goal{position:absolute;right:1%;top:36%;width:5%;height:28%;border:2px solid white;background:rgba(255,255,255,.18);display:flex;align-items:center;justify-content:center;font-size:12px}
#judge{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);background:rgba(0,0,0,.72);padding:14px 22px;border-radius:14px;font-size:22px;font-weight:bold;display:none;z-index:10;text-align:center}
.player,.enemy{position:absolute;border-radius:50%;transform:translate(-50%,-50%);display:flex;align-items:center;justify-content:center;font-weight:bold}
.player{width:42px;height:42px;background:#65ccff;color:#06202c;border:2px solid white;z-index:3;font-size:17px}
.owner{background:#ffe45c;box-shadow:0 0 0 5px rgba(255,228,92,.45),0 0 18px #ffe45c}
.selected{box-shadow:0 0 0 5px rgba(120,255,180,.55),0 0 18px #8cffb1}
.owner.selected{background:#ffe45c;box-shadow:0 0 0 5px rgba(255,228,92,.45),0 0 0 9px rgba(120,255,180,.35),0 0 18px #ffe45c}
.enemy{width:28px;height:28px;background:#ef5350;color:white;z-index:2;font-size:12px}
.circle{position:absolute;border-radius:50%;background:rgba(239,83,80,.13);border:2px solid rgba(255,120,120,.75);transform:translate(-50%,-50%)}
.zone{position:absolute;border:1px dashed rgba(255,255,255,.18);top:0;height:100%;width:20%}
.heat{position:absolute;pointer-events:none;z-index:1;opacity:.26}
#lines{position:absolute;width:100%;height:100%}
button{padding:10px;border-radius:10px;border:0;font-size:15px;font-weight:bold;cursor:pointer}
#targetBox{display:flex;flex-wrap:nowrap;gap:6px;margin-top:12px;margin-bottom:18px;justify-content:center}
#targetBox button{min-width:52px;padding:6px 8px;font-size:13px}
#targetBox button.active{background:#8cffb1;color:#06202c}
#controls{display:grid;grid-template-columns:repeat(3,64px);gap:12px;margin-top:14px;margin-left:auto;margin-right:auto;width:max-content}
#controls button{width:64px;height:56px;font-size:20px;padding:0}
#shootBtn.shot-high{background:#63ff9f;color:#06202c}
#shootBtn.shot-mid{background:#ffe45c;color:#06202c}
.actions{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px;justify-content:flex-end}
.actions button{padding:8px 10px;font-size:13px}
#msg,#status,#roster,#log{margin-top:8px;background:rgba(255,255,255,.12);padding:8px;border-radius:10px;line-height:1.45;font-size:13px;min-height:18px}
#roster{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:4px}
.card{background:rgba(255,255,255,.08);padding:6px;border-radius:8px}
@media (max-width:600px){.player{width:44px;height:44px}.actions{justify-content:flex-end}}
</style>
</head>
<body>
<div id="app">
  <h1>Mark Circle Tactics <span style="font-size:12px;opacity:.75">v17 守備接触・角度・可視化</span></h1>
  <div id="field"><svg id="lines"></svg><div id="goal">GOAL</div><div id="judge"></div></div>
  <div id="targetBox"></div>
  <div id="controls">
    <button onclick="moveDir(-1,-1)">↖</button><button onclick="moveDir(0,-1)">↑</button><button onclick="moveDir(1,-1)">↗</button>
    <button onclick="moveDir(-1,0)">←</button><button id="shootBtn" onclick="shoot()">シュート</button><button onclick="moveDir(1,0)">→</button>
    <button onclick="moveDir(-1,1)">↙</button><button onclick="moveDir(0,1)">↓</button><button onclick="moveDir(1,1)">↘</button>
  </div>
  <div class="actions">
    <button onclick="resetMatch()">リセット</button><button onclick="rerollTeam()">能力再抽選</button><button onclick="saveTeam()">チーム保存</button><button onclick="loadTeam()">保存チーム</button><button onclick="toggleDangerMap()">危険マップ</button>
  </div>
  <div id="status"></div><div id="roster"></div><div id="msg"></div><div id="log"></div>
</div>
<script>
const field=document.getElementById("field"),svg=document.getElementById("lines"),msg=document.getElementById("msg"),status=document.getElementById("status"),roster=document.getElementById("roster"),judge=document.getElementById("judge"),logBox=document.getElementById("log"),targetBox=document.getElementById("targetBox"),shootBtn=document.getElementById("shootBtn");
let players=[],enemies=[],owner=0,selected=0,score=0,turn=1,attackLog=[];
let holdTurn=0,holderId=0,eOffballStreak=0,pressLevel=0;
let receivedTurn=0,lastReceiveWasPass=false;
let lastCoverTarget=null,lastMarkTarget=null,lastSwTarget=null;
let showDangerMap=false,defMemory={},dribbleStreak=0,lastHolderForDribble=null;
function rand(min,max){return Math.floor(Math.random()*(max-min+1))+min}
function clamp(v,min,max){return Math.max(min,Math.min(max,v))}
function dist(a,b){return Math.hypot(a.x-b.x,a.y-b.y)}

const basePlayers=[
 {n:"A",role:"司令塔",x:12,y:50,pass:24,shoot:10,one:9,spd:5},
 {n:"B",role:"左サイド",x:30,y:28,pass:19,shoot:15,one:16,spd:8},
 {n:"C",role:"右サイド",x:31,y:72,pass:19,shoot:15,one:16,spd:8},
 {n:"D",role:"ミドル",x:58,y:45,pass:21,shoot:20,one:14,spd:7},
 {n:"E",role:"フィニッシャー",x:78,y:50,pass:15,shoot:28,one:11,spd:6}
];

function makePlayer(b){return {...b,pass:b.pass+rand(-3,3),shoot:b.shoot+rand(-3,3),one:b.one+rand(-2,2),spd:b.spd+rand(-1,1)}}
function createTeam(){players=basePlayers.map(makePlayer)}
function createEnemies(){
 enemies=[
  // 1-2-1気味の初期配置。V=守備移動速度
  {name:"PRESS",x:43,y:50,homeX:43,homeY:50,r:7,def:rand(9,15),spd:rand(5,9),role:"press"},
  {name:"COVER",x:58,y:38,homeX:58,homeY:38,r:8,def:rand(10,16),spd:rand(5,9),role:"cover"},
  {name:"MARK",x:58,y:62,homeX:58,homeY:62,r:7,def:rand(9,16),spd:rand(5,9),role:"mark"},
  {name:"SW",x:74,y:50,homeX:74,homeY:50,r:8,def:rand(10,17),spd:rand(5,9),role:"sw"},
  {name:"GK",x:89,y:50,homeX:89,homeY:50,r:10,def:rand(13,20),spd:rand(4,7),role:"keeper"}
 ];
}
function resetPositions(){const xs=[12,30,31,58,78],ys=[50,28,72,45,50];players.forEach((p,i)=>{p.x=xs[i];p.y=ys[i]});enemies.forEach(e=>{e.x=e.homeX;e.y=e.homeY})}
function resetMatch(){resetPositions();owner=0;selected=0;score=0;turn=1;attackLog=[];holdTurn=0;holderId=0;eOffballStreak=0;pressLevel=0;receivedTurn=0;lastReceiveWasPass=false;lastCoverTarget=null;lastMarkTarget=null;lastSwTarget=null;defMemory={};dribbleStreak=0;lastHolderForDribble=null;msg.textContent="守備を動かして、空いたスペースを探そう。";logBox.innerHTML="";draw()}
function rerollTeam(){createTeam();createEnemies();resetMatch();showJudge("TEAM RESET","能力再抽選",1800)}
function saveTeam(){localStorage.setItem("markCircleTeam",JSON.stringify({players,enemies}));showJudge("SAVE","チーム保存",1800);msg.textContent="現在のチーム能力を保存しました。"}
function loadTeam(){const data=localStorage.getItem("markCircleTeam");if(!data){showJudge("NO DATA","保存なし",2000);msg.textContent="保存チームがありません。";return}const saved=JSON.parse(data);players=saved.players;enemies=saved.enemies;resetMatch();showJudge("LOAD","保存チーム",1800)}
function resetAttackOnly(){resetPositions();owner=0;selected=0;attackLog=[];receivedTurn=0;lastReceiveWasPass=false;holdTurn=0;holderId=0;eOffballStreak=0;pressLevel=0;defMemory={};dribbleStreak=0;lastHolderForDribble=null;}
function marks(p){return enemies.filter(e=>e.role!=="keeper"&&dist(p,e)<e.r)}
function lineDef(a,b){
 let total=0;
 enemies.forEach(e=>{
  if(e.role==="keeper")return;
  const dx=b.x-a.x,dy=b.y-a.y,len=dx*dx+dy*dy;
  if(!len)return;
  const t=Math.max(0,Math.min(1,((e.x-a.x)*dx+(e.y-a.y)*dy)/len));
  const px=a.x+t*dx,py=a.y+t*dy;
  const d=Math.hypot(px-e.x,py-e.y);

  // パスレーン遮断を強化。近いほど大きく減点。
  if(t>.05&&t<.95&&d<e.r*.95){
   let rate=.45;
   if(d<e.r*.35)rate=1.00;
   else if(d<e.r*.60)rate=.75;
   total+=Math.floor(e.def*rate);
  }
 });
 return total;
}
function receiverRisk(to){
 // 受けた後の危険度。パス成功判定とは分ける。
 const receiveDef=marks(to).reduce((s,e)=>s+e.def,0);
 const finishZoneRisk=to.role==="フィニッシャー"&&to.x>72?8:0;
 const dangerReceiveRisk=to.x>64&&(to.role==="ミドル"||to.role==="フィニッシャー")?6:0;
 return receiveDef+finishZoneRisk+dangerReceiveRisk;
}

function passerPressure(from){
 // 出し手が囲まれているとパス精度が落ちる。ただし重くしすぎない。
 return Math.floor(marks(from).reduce((s,e)=>s+e.def,0)*0.45);
}

function passDifficulty(from,to){
 const distancePenalty=Math.floor(dist(from,to)/4);
 const courseDef=lineDef(from,to);
 const pressure=passerPressure(from)+currentPressPenalty();

 // パスが「通るか」は、距離・コース・出し手圧力を中心に見る。
 const lightReceive=Math.floor(marks(to).reduce((s,e)=>s+e.def,0)*0.18);

 // 危険ゾーンへのラストパスは、コースを切られていたら重くする
 const lastPassDanger=(to.role==="フィニッシャー"&&to.x>70)?Math.floor(courseDef*.35):0;

 const total=distancePenalty+courseDef+pressure+lightReceive+lastPassDanger;

 return{
  distancePenalty,
  courseDef,
  pressure,
  lightReceive,
  lastPassDanger,
  receiveRisk:receiverRisk(to),
  total
 };
}

function passColor(from,to){
 const d=passDifficulty(from,to).total;
 if(d<=12)return "#63ff9f";
 if(d<=24)return "#ffe45c";
 return "#ff6b6b";
}

function passTo(i){if(i===owner){selected=i;draw();return}const from=players[owner],to=players[i],diff=passDifficulty(from,to),pressPenalty=currentPressPenalty(),attack=from.pass+rand(1,5)-pressPenalty,defense=diff.total,rate=passSuccessRate(defense),roll=rand(1,100),baseSuccess=attack>defense;turn++;dribbleStreak=0;lastHolderForDribble=null;if(baseSuccess&&roll<=rate){attackLog.push(`${from.n}→${to.n} パス成功`);owner=i;selected=i;holderId=i;holdTurn=0;eOffballStreak=0;receivedTurn=turn;lastReceiveWasPass=true;showJudge("PASS SUCCESS","パス成功",1800);msg.innerHTML=`${from.n}→${to.n} 成功。<br>P判定 ${attack} ＞ 守備${defense}<br>成功率${rate}% / ロール${roll}<br>圧力-${pressPenalty} / 受け後リスク${diff.receiveRisk}`;defenseMove("pass");pressureCheck()}else{attackLog.push(`${from.n}→${to.n} パスずれ`);showJudge("PASS MISS","パスがずれた",2200);msg.innerHTML=`パスがずれた。<br>P判定 ${attack} ${baseSuccess?">":"<"} 守備${defense}<br>成功率${rate}% / ロール${roll}<br>攻撃は継続するが、ボールは出し手に残る。`;defenseMove("pass")}draw();}


function moveDir(dx,dy){const p=players[selected],len=Math.hypot(dx,dy);if(!len)return;const nx=dx/len,ny=dy/len,oldX=p.x,oldY=p.y,isOwnerMove=selected===owner;if(isOwnerMove){if(lastHolderForDribble===owner)dribbleStreak++;else{lastHolderForDribble=owner;dribbleStreak=1}}else{dribbleStreak=0;lastHolderForDribble=null}p.x=clamp(p.x+nx*p.spd,6,84);p.y=clamp(p.y+ny*p.spd,10,90);turn++;if(selected===owner){holdTurn=0;eOffballStreak=0;lastReceiveWasPass=false;const cd=contactDefDetail(p),coef=dribbleLearnCoef(),effectiveDef=Math.floor(cd.total*coef),attack=p.one;if(cd.total>0&&attack<=effectiveDef){p.x=oldX;p.y=oldY;attackLog.push(`${p.n} ドリブル失敗`);showJudge("DRIBBLE STOP","抜けなかった",2200);msg.innerHTML=`${p.n}は抜けなかった。<br>O${attack} ≤ 接触DF${cd.total} × 学習${coef.toFixed(1)} = ${effectiveDef}<br>接触内訳：${cd.parts}<br>移動なし・保持継続。`;defenseMove("ball")}else{attackLog.push(`${p.n} ドリブル`);showJudge("DRIBBLE","移動",1400);msg.innerHTML=`${p.n}がV${p.spd}でドリブル。<br>O${attack} / 接触DF${cd.total} × 学習${coef.toFixed(1)} = ${effectiveDef}<br>接触内訳：${cd.parts}`;supportMoveAfterDribble();defenseMove("ball")}}else{attackLog.push(`${p.n} オフボール移動`);showJudge("MOVE","味方移動",1400);msg.textContent=`${p.n}を動かした。危険選手には担当DFがついていく。`;if(p.role==="フィニッシャー")eOffballStreak++;else eOffballStreak=0;holdTurn++;defenseMove("offball",p);pressureCheck()}draw();}


function supportMoveAfterDribble(){
 const ball=players[owner];
 players.forEach((p,i)=>{
  if(i===owner)return;
  if(p.role==="左サイド"){p.x=clamp(p.x+1.6,6,84);p.y=clamp(p.y-1.2,10,90)}
  if(p.role==="右サイド"){p.x=clamp(p.x+1.6,6,84);p.y=clamp(p.y+1.2,10,90)}
  if(p.role==="ミドル"){const targetX=Math.max(ball.x+14,52),targetY=ball.y*.35+50*.65;p.x=clamp(p.x+(targetX-p.x)*.035,50,66);p.y=clamp(p.y+(targetY-p.y)*.025,32,68)}
  if(p.role==="司令塔"){const sideOwner=ball.role==="左サイド"||ball.role==="右サイド";if(sideOwner&&ball.x>35){p.x=clamp(p.x+(ball.x-18-p.x)*.10,6,52);p.y=clamp(p.y+(ball.y-p.y)*.08,20,80)}else{p.x=clamp(p.x-.3,6,84);p.y=clamp(p.y+(50-p.y)*.04,10,90)}}
 });
}


function enemyContactValue(e){return Math.floor(e.def*0.4)}
function contactEnemies(p){return enemies.filter(e=>e.role!=="keeper"&&dist(p,e)<e.r*1.5)}
function contactDefDetail(p){const list=contactEnemies(p).map(e=>({e,value:enemyContactValue(e)}));const total=list.reduce((s,x)=>s+x.value,0);const parts=list.map(x=>`${x.e.def}/V${x.e.spd||6}:${x.value}`).join(" + ")||"なし";return{total,parts,count:list.length,list}}
function dribbleLearnCoef(){const n=Math.max(1,dribbleStreak);if(n===1)return 1.1;if(n===2)return 1.3;if(n===3)return 1.5;if(n===4)return 1.8;return 2.0}
function passSuccessRate(d){if(d<=10)return 100;if(d<=20)return 85;if(d<=30)return 70;return 50}
function angleBand(p){const ay=Math.abs(p.y-50);if(ay<=12)return{name:"中央",min:1,max:1};if(ay<=24)return{name:"やや斜め",min:.95,max:1};if(ay<=36)return{name:"サイド",min:.80,max:.95};return{name:"深いサイド",min:.50,max:.85}}
function angleFactor(p){const b=angleBand(p);return b.min===b.max?b.min:b.min+Math.random()*(b.max-b.min)}
function courseDefDetail(shooter){const goal={x:96,y:50};let total=0,parts=[];enemies.forEach(e=>{if(e.role==="keeper")return;const dx=goal.x-shooter.x,dy=goal.y-shooter.y,len=dx*dx+dy*dy;if(!len)return;const t=Math.max(0,Math.min(1,((e.x-shooter.x)*dx+(e.y-shooter.y)*dy)/len));if(t<=.05||t>=.95)return;const px=shooter.x+t*dx,py=shooter.y+t*dy,d=Math.hypot(px-e.x,py-e.y);if(d<e.r*.45){const v=Math.floor(e.def*.3);total+=v;parts.push(`線上${e.def}/V${e.spd||6}:${v}`)}else if(d<e.r*.95){const v=Math.floor(e.def*.15);total+=v;parts.push(`半身${e.def}/V${e.spd||6}:${v}`)}});return{total,parts:parts.join(" + ")||"なし"}}
function chanceCapByDistance(dp){if(dp<=3)return 6;if(dp<=5)return 5;if(dp<=7)return 3;if(dp===8)return 2;return 1}
function minSuccessByDistance(dp){if(dp<=3)return 0;if(dp<=5)return 1;if(dp<=7)return 3;if(dp===8)return 6;if(dp===9)return 9;return 9+(dp-9)*4}
function finishBonusDetail(contactDef,courseDef,dp){let raw=0,items=[];if(contactDef===0){raw+=1;items.push("+1 接触DF0")}if(courseDef===0){raw+=1;items.push("+1 コースDF0")}if(contactDef===0&&courseDef===0){raw+=2;items.push("+2 完全フリー")}if(lastReceiveWasPass&&turn-receivedTurn<=1){raw+=2;items.push("+2 パス直後")}const cap=chanceCapByDistance(dp),bonus=Math.min(raw,cap);if(raw>cap)items.push(`距離${dp}上限 ${cap}`);return{bonus,raw,cap,items}}
function distanceDangerScore(p){const goal=goalPoint(),dp=Math.floor(dist(p,goal)/6);if(dp<=4)return 5;if(dp<=6)return 4;if(dp<=8)return 3;if(dp<=10)return 2;return 0}
function centralDangerScore(p){const ay=Math.abs(p.y-50);if(ay<=14)return 4;if(ay<=28)return 2;return 0}
function passLaneGradeTo(p){const d=passDifficulty(players[owner],p).total;if(d<=12)return"green";if(d<=24)return"yellow";return"red"}
function passDangerScore(p){const g=passLaneGradeTo(p);if(g==="green")return 4;if(g==="yellow")return 2;return 0}
function freeDangerScore(p){const cnt=contactEnemies(p).length;if(cnt===0)return 5;if(cnt===1)return 1;return 0}
function floatingDangerDetail(p){const pg=passLaneGradeTo(p),cnt=contactEnemies(p).length,di=distanceDangerScore(p),ce=centralDangerScore(p),pa=passDangerScore(p),fr=freeDangerScore(p);let score=di+ce+pa+fr,caps=[];if(pg==="red"){score=Math.min(score,11);caps.push("赤パス上限11")}if(cnt>=2){score=Math.min(score,11);caps.push("DF2人以上上限11")}return{score,distance:di,central:ce,pass:pa,free:fr,passGrade:pg,nearCnt:cnt,caps}}
function coverRateFromFloating(score){if(score>=18)return 1;if(score>=15)return .8;if(score>=12)return .3;return 0}
function downgradeCoverRate(rate){if(rate>=1)return .8;if(rate>=.8)return .3;return 0}
function hasCloseAssignedDef(target,assignments){return assignments.some(a=>a.target===target&&dist(a.def,target)<a.def.r*1.5)}

function shotContactDef(shooter){return contactDefDetail(shooter).total;}

function shotCourseDef(shooter){return courseDefDetail(shooter).total;}

function finishBonus(contactDef,courseDef,distancePenalty=0){return finishBonusDetail(contactDef,courseDef,distancePenalty).bonus;}


function shotScore(){const p=players[owner],goal={x:96,y:50},dp=Math.floor(dist(p,goal)/6),cd=contactDefDetail(p),co=courseDefDetail(p),keeper=enemies.find(e=>e.role==="keeper").def,detail=finishBonusDetail(cd.total,co.total,dp),pressPenalty=currentPressPenalty(),af=angleFactor(p),effectiveS=Math.floor(p.shoot*af);return effectiveS+detail.bonus-pressPenalty-dp-cd.total-co.total-keeper;}

function updateShootButton(){shootBtn.classList.remove("shot-high","shot-mid");const p=players[owner],goal={x:96,y:50},dp=Math.floor(dist(p,goal)/6),chance=shotScore(),need=minSuccessByDistance(dp);if(chance>=need+4)shootBtn.classList.add("shot-high");else if(chance>=need)shootBtn.classList.add("shot-mid");}

function shoot(){const p=players[owner],goal={x:96,y:50},randomBonus=rand(-2,2),pressPenalty=currentPressPenalty(),dp=Math.floor(dist(p,goal)/6),cd=contactDefDetail(p),co=courseDefDetail(p),keeper=enemies.find(e=>e.role==="keeper").def,detail=finishBonusDetail(cd.total,co.total,dp),angle=angleBand(p),af=angleFactor(p),effectiveS=Math.floor(p.shoot*af),result=effectiveS+randomBonus+detail.bonus-pressPenalty-dp-cd.total-co.total-keeper,need=minSuccessByDistance(dp);turn++;const detailLines=detail.items.join("<br>")||"なし";const formula=`${p.n} シュート<br>S${p.shoot}×角度${af.toFixed(2)}(${angle.name})=${effectiveS}<br>乱数 ${randomBonus}<br>決定機 ${detail.bonus} / raw${detail.raw} / 上限${detail.cap}<br>${detailLines}<br>接触DF -${cd.total}（${cd.parts}）<br>コースDF -${co.total}（${co.parts}）<br>距離 -${dp}<br>GK -${keeper}<br>= ${result} / 距離閾値 ${need}`;if(result>=need){score++;attackLog.push(`${p.n} シュート成功`);showJudge("SHOT SUCCESS","ゴール",3500);msg.innerHTML=`ゴール！<br>${formula}`;showAttackLog("ゴールまでの流れ");resetAttackOnly()}else{attackLog.push(`${p.n} シュート失敗`);showJudge("SHOT FAILED","シュート失敗",3200);msg.innerHTML=`失敗。<br>${formula}`;counterAttack();resetAttackOnly()}draw();}

function counterAttack(){const enemyPower=rand(10,22)+Math.floor(enemies.reduce((s,e)=>s+e.def,0)/9),ourDefense=rand(11,23)+Math.floor(players.reduce((s,p)=>s+p.one+p.spd,0)/17);if(enemyPower>ourDefense){showJudge("COUNTER GOAL","カウンター失点",3500);msg.textContent+=` / カウンター失点：敵${enemyPower} ＞ 味方守備${ourDefense}`}else{showJudge("COUNTER STOP","カウンター阻止",2800);msg.textContent+=` / カウンター阻止：敵${enemyPower} ≤ 味方守備${ourDefense}`}showAttackLog("今回の攻撃")}

function lineBlockPosition(from,to,ratio=.52){
 return {x:from.x*(1-ratio)+to.x*ratio,y:from.y*(1-ratio)+to.y*ratio};
}
function blendPos(a,b,rate){
 return {x:a.x*(1-rate)+b.x*rate,y:a.y*(1-rate)+b.y*rate};
}
function ballDistanceWeight(target){
 const ball=players[owner];
 const d=dist(ball,target);
 if(d>=40)return .85;
 if(d>=28)return .70;
 if(d>=18)return .55;
 return .40;
}
function markTargetPosition(target,kind){
 const ball=players[owner];
 const goalSide=goalSidePosition(target,kind==="E"?.56:.58);
 const passLane=lineBlockPosition(ball,target,.52);
 let watch=ballDistanceWeight(target);

 // Eはボールが遠いほどかなり見る。近い時はラストパスの線を切る。
 if(kind==="E" && dist(ball,target)>=28)watch=.92;

 // D担当は、サイド保持時にはゴール側よりC/B→Dラインを優先する。
 if(kind==="D" && (ball.role==="右サイド"||ball.role==="左サイド"))watch=.18;

 return {x:goalSide.x*watch+passLane.x*(1-watch),y:goalSide.y*watch+passLane.y*(1-watch)};
}
function nearestEnemyByRole(role){
 let best=null,bestD=999;
 enemies.forEach(e=>{if(e.role!==role)return;const d=dist(e,players[owner]);if(d<bestD){best=e;bestD=d}});
 return best;
}
function forceOffballFollow(movedPlayer){
 if(!movedPlayer)return;
 const ball=players[owner];

 // フィニッシャー単独のオフボールで簡単に完全フリーを作らせない
 if(movedPlayer.role==="フィニッシャー"){
  const marker=enemies.find(e=>e.role==="mark");
  if(marker){
   const farBall=dist(ball,movedPlayer)>=24;
   const target=markTargetPosition(movedPlayer,"E");
   const react=farBall?.82:.58;
   marker.x+= (target.x-marker.x)*react;
   marker.y+= (target.y-marker.y)*react;
  }
 }

 // サイド保持者に対してはPRESSが即時に詰める
 if(movedPlayer===ball || ball.role==="右サイド" || ball.role==="左サイド"){
  const press=enemies.find(e=>e.role==="press");
  if(press){
   const target=pressTargetPosition(ball,.90);
   press.x+=(target.x-press.x)*.60;
   press.y+=(target.y-press.y)*.60;
  }
 }
}
function pressTargetPosition(attacker,aggression=.78){
 const ball=players[owner];
 const goalCut=goalSidePosition(attacker,.70);
 const ballLane=lineBlockPosition(ball,attacker,.62);
 return blendPos(goalCut,ballLane,1-aggression);
}
function holderPressureBonus(){
 return Math.min(12,holdTurn*3);
}
function currentPressPenalty(){
 // 保持プレス中は技術値が落ちる
 return Math.min(7,Math.floor(holderPressureBonus()*.55));
}

function pressureCheck(){
 const holder=players[owner];
 const contact=marks(holder);
 const pressure=holderPressureBonus();

 if(!contact.length && pressure<5)return false;

 const nearbyDef=contact.reduce((s,e)=>s+e.def,0);
 const depthPenalty=holder.x>50?Math.floor(holder.x/20):0;
 const attack=holder.one+rand(0,2)-currentPressPenalty();
 const defense=nearbyDef+depthPenalty+pressure;

 if(defense>attack+3){
  attackLog.push(`${holder.n} 保持しすぎてロスト`);
  showJudge("PRESS LOST","保持時間で奪われた",3200);
  msg.textContent=`保持プレス。${holder.n}保持${attack} ＜ 守備${defense}。ボールを止めたまま味方を動かしすぎると危険。`;
  counterAttack();
  resetAttackOnly();
  return true;
 }else if(pressure>=5){
  attackLog.push(`${holder.n} 保持プレスを受ける`);
  showJudge("PRESSURE","寄せられている",1800);
  msg.textContent=`保持プレス上昇中。${holder.n}保持${attack} / 守備圧${defense}。以後のパス・突破・シュートが弱くなる。`;
  return false;
 }

 return false;
}

function showAttackLog(title){logBox.innerHTML=`<b>${title}</b><br>`+(attackLog.length?attackLog.map((x,i)=>`${i+1}. ${x}`).join("<br>"):"記録なし")}
function goalSidePosition(attacker,ratio=.62){const goal={x:96,y:50};return{x:attacker.x*ratio+goal.x*(1-ratio),y:attacker.y*ratio+goal.y*(1-ratio)}}


function goalPoint(){return {x:96,y:50}}

function isGoalSide(defender,attacker){
 const goal=goalPoint();
 const gx=goal.x-attacker.x,gy=goal.y-attacker.y;
 const dx=defender.x-attacker.x,dy=defender.y-attacker.y;
 return gx*dx+gy*dy>-2;
}

function positionDangerAt(x,y){
 const goal=goalPoint();
 const d=Math.hypot(goal.x-x,goal.y-y);
 const central=Math.max(0,1-Math.abs(y-50)/42);
 const depth=Math.max(0,(x-45)/45);
 const near=Math.max(0,(55-d)/55);
 return clamp(near*70+central*18+depth*16,0,100);
}
function positionDanger(p){return positionDangerAt(p.x,p.y)}

function threatScore(p,i){
 if(i===owner)return 999;
 // v15: 守備は選手能力を読まない。危険度は位置のみ。
 return positionDanger(p);
}

function getThreats(){
 return players.map((p,i)=>({p,i,score:threatScore(p,i)})).filter(t=>t.i!==owner).sort((a,b)=>b.score-a.score);
}
function nonKeeperDefs(){return enemies.filter(e=>e.role!=="keeper")}

function nearestEligibleDef(target,available){
 const goalSide=available.filter(e=>isGoalSide(e,target));
 const pool=goalSide.length?goalSide:available;
 return pool.map(e=>({e,score:dist(e,target)+(isGoalSide(e,target)?0:18)})).sort((a,b)=>a.score-b.score)[0]?.e || null;
}

function assignDefenders(){
 const defs=nonKeeperDefs(),used=new Set(),assignments=[],ball=players[owner];
 const holderDef=nearestEligibleDef(ball,defs);
 if(holderDef){assignments.push({def:holderDef,target:ball,targetIndex:owner,type:"holder",key:`holder-${owner}`});used.add(holderDef.name)}
 const threats=getThreats();
 for(const th of threats){
  const remaining=defs.filter(e=>!used.has(e.name));
  if(remaining.length<=1)break;
  if(th.score<30)continue;
  const d=nearestEligibleDef(th.p,remaining);
  if(!d)continue;
  assignments.push({def:d,target:th.p,targetIndex:th.i,type:"mark",threat:th.score,key:`mark-${th.i}`});
  used.add(d.name);
 }
 const cover=defs.find(e=>!used.has(e.name))||null;
 return {assignments,cover,threats};
}
function getAssignmentFor(def,info){return info.assignments.find(a=>a.def===def)||null}
function laneBlockPosition(from,to,ratio=.52){return {x:from.x*(1-ratio)+to.x*ratio,y:from.y*(1-ratio)+to.y*ratio}}
function blendPos(a,b,rate){return {x:a.x*(1-rate)+b.x*rate,y:a.y*(1-rate)+b.y*rate}}
function pressTargetPosition(attacker,aggression=.86){const goalCut=goalSidePosition(attacker,.76),direct={x:attacker.x+2,y:attacker.y};return blendPos(goalCut,direct,1-aggression)}

function markTargetPositionV15(target){
 const ball=players[owner],danger=positionDanger(target),passLane=laneBlockPosition(ball,target,.52),goalSide=goalSidePosition(target,danger>62?.62:.70);
 const closeRate=clamp((danger-35)/45,0.15,0.62);
 return blendPos(passLane,goalSide,closeRate);
}

function coverTargetPositionV15(info){const candidates=players.map((p,i)=>({p,i,fd:i===owner?{score:0}:floatingDangerDetail(p)})).filter(x=>x.i!==owner&&x.fd.score>=12).sort((a,b)=>b.fd.score-a.fd.score),goal=goalPoint();if(candidates.length>=2){const a=candidates[0].p,b=candidates[1].p,mid={x:(a.x+b.x)/2,y:(a.y+b.y)/2};return blendPos(mid,goal,.22)}if(candidates.length===1)return blendPos(goalSidePosition(candidates[0].p,.52),{x:75,y:50},.25);const threats=info.threats.filter(t=>t.score>25);if(threats.length>=2){const a=threats[0].p,b=threats[1].p,mid={x:(a.x+b.x)/2,y:(a.y+b.y)/2};return blendPos(mid,goal,.28)}if(threats.length===1)return blendPos(goalSidePosition(threats[0].p,.48),{x:75,y:50},.30);return{x:74,y:50};}


function reactionRateFor(def,key,target){
 const prev=defMemory[def.name];
 const moved=prev?Math.hypot(target.x-prev.tx,target.y-prev.ty):999;
 const danger=positionDangerAt(target.x,target.y);
 const dangerChange=prev?Math.abs(danger-prev.danger):999;
 let stage=2;
 if(!prev||prev.key!==key){stage=0} // 対象変更：30%
 else if(moved>5||dangerChange>12){stage=Math.min(prev.stage??2,1)} // 同対象の大変化：80%
 else{stage=Math.min(2,(prev.stage??0)+1)} // 30→80→100
 const rates=[.30,.80,1.00];
 defMemory[def.name]={key,stage,tx:target.x,ty:target.y,danger};
 return rates[stage];
}

function moveDefenderToward(e,target,rate){
 const dx=target.x-e.x,dy=target.y-e.y,d=Math.hypot(dx,dy);
 if(!d)return;
 const rnd=1+(rand(-1,1)*.05); // 小ランダム
 const maxMove=(e.spd||6)*rate*rnd;
 const step=Math.min(d,maxMove);
 e.x+=dx/d*step;e.y+=dy/d*step;
 e.x=clamp(e.x,8,88);e.y=clamp(e.y,8,92);
}

function forceOffballFollow(movedPlayer){return}

function defenseMove(mode="ball",movedPlayer=null){
 const info=assignDefenders(),ball=players[owner],pressureBoost=holderPressureBonus();
 enemies.forEach(e=>{
  if(e.role==="keeper"){
   const target={x:clamp(89+(ball.x-70)*.08,86,92),y:clamp(50+(ball.y-50)*.30,34,66)};
   moveDefenderToward(e,target,.80);return;
  }
  let target={x:e.homeX,y:e.homeY},key=`home-${e.name}`;
  const asg=getAssignmentFor(e,info);
  if(asg){
   const p=asg.target;key=asg.key;
   if(asg.type==="holder"){
    target=pressTargetPosition(p,.90);
    if(pressureBoost>0)target=blendPos(target,p,Math.min(.25,pressureBoost*.015));
   }else{
    target=markTargetPositionV15(p);
   }
  }else if(info.cover===e){
   target=coverTargetPositionV15(info);
   const top=info.threats[0],second=info.threats[1];
   key=`cover-${top?.i??"none"}-${second?.i??"none"}`;
  }else{
   target={x:e.homeX,y:e.homeY};key=`home-${e.name}`;
  }
  const rate=reactionRateFor(e,key,target);
  moveDefenderToward(e,target,rate);
 });
}

function toggleDangerMap(){showDangerMap=!showDangerMap;draw()}
function drawDangerMap(){
 if(!showDangerMap)return;
 const cols=16,rows=10;
 for(let ix=0;ix<cols;ix++)for(let iy=0;iy<rows;iy++){
  const x=(ix+.5)*100/cols,y=(iy+.5)*100/rows,danger=positionDangerAt(x,y);
  if(danger<18)continue;
  const div=document.createElement("div");div.className="heat";
  div.style.left=(ix*100/cols)+"%";div.style.top=(iy*100/rows)+"%";div.style.width=(100/cols)+"%";div.style.height=(100/rows)+"%";
  let bg="rgba(80,255,130,.35)";
  if(danger>45)bg="rgba(255,228,92,.42)";
  if(danger>65)bg="rgba(255,120,60,.48)";
  if(danger>82)bg="rgba(255,60,60,.55)";
  div.style.background=bg;field.appendChild(div);
 }
}

function showJudge(main,sub,duration=1600){judge.innerHTML=`${main}<br><small>${sub}</small>`;judge.style.display="block";clearTimeout(showJudge.timer);showJudge.timer=setTimeout(()=>{judge.style.display="none"},duration)}
function draw(){
 field.querySelectorAll(".player,.enemy,.circle,.zone,.heat").forEach(e=>e.remove());svg.innerHTML="";
 targetBox.innerHTML=players.map((p,i)=>`<button class="${i===selected?'active':''}" onclick="selected=${i};draw()">選択 ${p.n}</button>`).join("");
 for(let i=0;i<5;i++){const z=document.createElement("div");z.className="zone";z.style.left=(i*20)+"%";field.appendChild(z)}
 drawDangerMap();
 enemies.forEach(e=>{const c=document.createElement("div");c.className="circle";c.style.left=e.x+"%";c.style.top=e.y+"%";c.style.width=e.r*2+"%";c.style.aspectRatio="1";field.appendChild(c);const b=document.createElement("div");b.className="enemy";b.style.left=e.x+"%";b.style.top=e.y+"%";b.textContent=e.role==="keeper"?"GK"+e.def:e.def+"/V"+(e.spd||6);field.appendChild(b)});
 players.forEach((p,i)=>{if(i!==owner){const l=document.createElementNS("http://www.w3.org/2000/svg","line");l.setAttribute("x1",players[owner].x+"%");l.setAttribute("y1",players[owner].y+"%");l.setAttribute("x2",p.x+"%");l.setAttribute("y2",p.y+"%");l.setAttribute("stroke",passColor(players[owner],p));l.setAttribute("stroke-width","4");svg.appendChild(l)}});
 players.forEach((p,i)=>{
 if(i!==owner){
  const fd=floatingDangerDetail(p);
  if(fd.score>=12){
   const r=document.createElement("div");
   r.className="circle";
   r.style.left=p.x+"%";
   r.style.top=p.y+"%";
   r.style.width="10%";
   r.style.aspectRatio="1";
   r.style.borderColor=fd.score>=18?"rgba(255,80,80,.95)":fd.score>=15?"rgba(255,228,92,.9)":"rgba(120,255,180,.9)";
   r.style.background=fd.score>=18?"rgba(255,80,80,.12)":fd.score>=15?"rgba(255,228,92,.10)":"rgba(120,255,180,.10)";
   field.appendChild(r);
  }
 }
 const el=document.createElement("button");
 el.className="player "+(i===owner?"owner ":"")+(i===selected?"selected":"");
 el.style.left=p.x+"%";
 el.style.top=p.y+"%";
 el.textContent=p.n;
 el.onclick=()=>passTo(i);
 field.appendChild(el);
});
 status.innerHTML=`得点：${score}　ターン：${turn}　ボール保持：${players[owner].n} ${players[owner].role}　選択中：${players[selected].n}<br>v17: 接触DF1.5 / ドリブル学習 / パス成功率 / 角度補正 / 詳細ログ`;
 roster.innerHTML=players.map(p=>`<div class="card"><b>${p.n} ${p.role}</b><br>P${p.pass} / S${p.shoot} / O${p.one} / V${p.spd}</div>`).join("")+`<div class="card"><b>GK</b><br>守備 ${enemies.find(e=>e.role==="keeper").def} / V${enemies.find(e=>e.role==="keeper").spd||6}</div>`;
 updateShootButton();
}
window.addEventListener("error",e=>{msg.textContent="エラー："+e.message});
createTeam();createEnemies();resetMatch();
</script>
