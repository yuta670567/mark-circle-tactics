<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mark Circle Tactics</title>
<style>
body{margin:0;background:#071b26;color:white;font-family:sans-serif}
#app{max-width:920px;margin:auto;padding:8px}
h1{font-size:18px;margin:4px 0 8px}
#field{position:relative;width:100%;aspect-ratio:16/10;background:#0b5d78;border:2px solid white;border-radius:14px;overflow:hidden}
#goal{position:absolute;right:1%;top:36%;width:5%;height:28%;border:2px solid white;background:rgba(255,255,255,.18);display:flex;align-items:center;justify-content:center;font-size:12px}
#judge{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);background:rgba(0,0,0,.72);padding:14px 22px;border-radius:14px;font-size:22px;font-weight:bold;display:none;z-index:10;text-align:center}
.player,.enemy{position:absolute;border-radius:50%;transform:translate(-50%,-50%);display:flex;align-items:center;justify-content:center;font-weight:bold}
.player{width:42px;height:42px;background:#65ccff;color:#06202c;border:2px solid white;z-index:3;font-size:17px}
.owner{background:#ffe45c;box-shadow:0 0 0 5px rgba(255,228,92,.45),0 0 18px #ffe45c}
.selected{box-shadow:0 0 0 5px rgba(120,255,180,.55),0 0 18px #8cffb1}
.owner.selected{background:#ffe45c;box-shadow:0 0 0 5px rgba(255,228,92,.45),0 0 0 9px rgba(120,255,180,.35),0 0 18px #ffe45c}
.enemy{width:28px;height:28px;background:#ef5350;color:white;z-index:2;font-size:12px}
.circle{position:absolute;border-radius:50%;background:rgba(239,83,80,.13);border:2px solid rgba(255,120,120,.75);transform:translate(-50%,-50%)}
.zone{position:absolute;border:1px dashed rgba(255,255,255,.18);top:0;height:100%;width:20%}
#lines{position:absolute;width:100%;height:100%}
button{padding:10px;border-radius:10px;border:0;font-size:15px;font-weight:bold;cursor:pointer}
#targetBox{display:flex;flex-wrap:nowrap;gap:6px;margin-top:12px;margin-bottom:18px;justify-content:center}
#targetBox button{min-width:52px;padding:6px 8px;font-size:13px}
#targetBox button.active{background:#8cffb1;color:#06202c}
#controls{display:grid;grid-template-columns:repeat(3,64px);gap:12px;margin-top:14px;margin-left:auto;margin-right:auto;width:max-content}
#controls button{width:64px;height:56px;font-size:20px;padding:0}
#shootBtn.shot-high{background:#63ff9f;color:#06202c}
#shootBtn.shot-mid{background:#ffe45c;color:#06202c}
.actions{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px;justify-content:flex-end}
.actions button{padding:8px 10px;font-size:13px}
#msg,#status,#roster,#log{margin-top:8px;background:rgba(255,255,255,.12);padding:8px;border-radius:10px;line-height:1.45;font-size:13px}
#roster{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:4px}
.card{background:rgba(255,255,255,.08);padding:6px;border-radius:8px}
@media (max-width:600px){.player{width:44px;height:44px}.actions{justify-content:flex-end}}
</style>
</head>

<body>
<div id="app">
  <h1>Mark Circle Tactics</h1>

  <div id="field">
    <svg id="lines"></svg>
    <div id="goal">GOAL</div>
    <div id="judge"></div>
  </div>

  <div id="targetBox"></div>

  <div id="controls">
    <button onclick="moveDir(-1,-1)">↖</button>
    <button onclick="moveDir(0,-1)">↑</button>
    <button onclick="moveDir(1,-1)">↗</button>
    <button onclick="moveDir(-1,0)">←</button>
    <button id="shootBtn" onclick="shoot()">シュート</button>
    <button onclick="moveDir(1,0)">→</button>
    <button onclick="moveDir(-1,1)">↙</button>
    <button onclick="moveDir(0,1)">↓</button>
    <button onclick="moveDir(1,1)">↘</button>
  </div>

  <div class="actions">
    <button onclick="resetMatch()">リセット</button>
    <button onclick="rerollTeam()">能力再抽選</button>
    <button onclick="saveTeam()">チーム保存</button>
    <button onclick="loadTeam()">保存チーム</button>
  </div>

  <div id="status"></div>
  <div id="roster"></div>
  <div id="msg"></div>
  <div id="log"></div>
</div>

<script>
const field=document.getElementById("field");
const svg=document.getElementById("lines");
const msg=document.getElementById("msg");
const status=document.getElementById("status");
const roster=document.getElementById("roster");
const judge=document.getElementById("judge");
const logBox=document.getElementById("log");
const targetBox=document.getElementById("targetBox");
const shootBtn=document.getElementById("shootBtn");

let players,enemies,owner,selected,score,turn,attackLog;

function rand(min,max){return Math.floor(Math.random()*(max-min+1))+min}
function clamp(v,min,max){return Math.max(min,Math.min(max,v))}
function dist(a,b){return Math.hypot(a.x-b.x,a.y-b.y)}

const basePlayers=[
  {n:"A",role:"司令塔",x:12,y:50,pass:24,shoot:10,one:9,spd:5},
  {n:"B",role:"左サイド",x:30,y:28,pass:19,shoot:15,one:16,spd:8},
  {n:"C",role:"右サイド",x:31,y:72,pass:19,shoot:15,one:16,spd:8},
  {n:"D",role:"ミドル",x:58,y:45,pass:21,shoot:20,one:14,spd:7},
  {n:"E",role:"フィニッシャー",x:78,y:50,pass:15,shoot:28,one:11,spd:6}
];

function makePlayer(b){
  return {...b,pass:b.pass+rand(-3,3),shoot:b.shoot+rand(-3,3),one:b.one+rand(-2,2),spd:b.spd+rand(-1,1)};
}

function createTeam(){players=basePlayers.map(makePlayer)}

function createEnemies(){
  enemies=[
    {name:"DMF",x:42,y:50,homeX:42,homeY:50,r:7,def:rand(7,14),role:"dmf"},
    {name:"LCB",x:60,y:34,homeX:60,homeY:34,r:7,def:rand(8,15),role:"lcb"},
    {name:"RCB",x:60,y:66,homeX:60,homeY:66,r:7,def:rand(8,15),role:"rcb"},
    {name:"SW",x:75,y:50,homeX:75,homeY:50,r:8,def:rand(9,16),role:"sw"},
    {name:"GK",x:89,y:50,homeX:89,homeY:50,r:10,def:rand(13,20),role:"keeper"}
  ];
}

function resetMatch(){
  resetPositions();
  owner=0; selected=0; score=0; turn=1; attackLog=[];
  msg.textContent="守備を動かして、空いたスペースを探そう。";
  logBox.innerHTML="";
  draw();
}

function resetPositions(){
  const xs=[12,30,31,58,78], ys=[50,28,72,45,50];
  players.forEach((p,i)=>{p.x=xs[i];p.y=ys[i]});
  enemies.forEach(e=>{e.x=e.homeX;e.y=e.homeY});
}

function rerollTeam(){
  createTeam(); createEnemies(); resetMatch();
  showJudge("TEAM RESET","能力再抽選");
}

function saveTeam(){
  localStorage.setItem("markCircleTeam",JSON.stringify({players,enemies}));
  showJudge("SAVE","チーム保存");
  msg.textContent="現在のチーム能力を保存しました。";
}

function loadTeam(){
  const data=localStorage.getItem("markCircleTeam");
  if(!data){showJudge("NO DATA","保存なし");msg.textContent="保存チームがありません。";return;}
  const saved=JSON.parse(data);
  players=saved.players; enemies=saved.enemies;
  resetMatch();
  showJudge("LOAD","保存チーム");
}

function resetAttackOnly(){
  resetPositions();
  owner=0; selected=0; attackLog=[];
}

function marks(p){
  return enemies.filter(e=>e.role!=="keeper" && dist(p,e)<e.r);
}

function lineDef(a,b){
  let total=0;
  enemies.forEach(e=>{
    const dx=b.x-a.x,dy=b.y-a.y,len=dx*dx+dy*dy;
    if(len===0)return;
    const t=Math.max(0,Math.min(1,((e.x-a.x)*dx+(e.y-a.y)*dy)/len));
    const px=a.x+t*dx,py=a.y+t*dy;
    if(Math.hypot(px-e.x,py-e.y)<e.r*.65) total+=e.def;
  });
  return total;
}

function passDifficulty(from,to){
  const distancePenalty=Math.floor(dist(from,to)/4);
  const courseDef=lineDef(from,to);
  const receiveDef=marks(to).reduce((s,e)=>s+e.def,0);
  const finishZonePenalty=to.role==="フィニッシャー" && to.x>72 ? 8 : 0;
  return {distancePenalty,courseDef,receiveDef,finishZonePenalty,total:distancePenalty+courseDef+receiveDef+finishZonePenalty};
}

function passColor(from,to){
  const d=passDifficulty(from,to).total;
  if(d<=12)return "#63ff9f";
  if(d<=24)return "#ffe45c";
  return "#ff6b6b";
}

function passTo(i){
  if(i===owner){selected=i;draw();return;}

  const from=players[owner],to=players[i];
  const diff=passDifficulty(from,to);
  const attack=from.pass+rand(1,5);
  const defense=diff.total;
  turn++;

  if(attack>defense){
    attackLog.push(`${from.n}→${to.n} パス成功`);
    owner=i; selected=i;
    showJudge("PASS SUCCESS","パス成功");
    msg.textContent=`${from.n}→${to.n} 成功。パス${attack} ＞ 守備${defense}`;
    defenseMove("pass");
  }else{
    attackLog.push(`${from.n}→${to.n} パス失敗`);
    showJudge("PASS FAILED","パス失敗");
    msg.textContent=`カット。パス${attack} ＜ 守備${defense}`;
    counterAttack();
    resetAttackOnly();
  }
  draw();
}

function moveDir(dx,dy){
  const p=players[selected];
  const len=Math.hypot(dx,dy);
  if(len===0)return;

  const nx=dx/len,ny=dy/len;
  const oldX=p.x,oldY=p.y;

  p.x=clamp(p.x+nx*p.spd,6,84);
  p.y=clamp(p.y+ny*p.spd,10,90);
  turn++;

  if(selected===owner){
    const contact=marks(p);

    if(contact.length>0){
      const attack=p.one+rand(0,2);
      const advancePenalty=Math.floor(p.x/25);
      const defense=contact.reduce((s,e)=>s+e.def,0)+advancePenalty;

      if(attack>defense){
        attackLog.push(`${p.n} 1on1突破`);
        showJudge("1on1 WIN","突破成功");
        msg.textContent=`${p.n}突破。1on1 ${attack} ＞ 守備${defense}`;
        supportMoveAfterDribble();
        defenseMove("ball");
      }else{
        p.x=oldX;p.y=oldY;
        attackLog.push(`${p.n} 1on1失敗`);
        showJudge("1on1 LOSE","突破失敗");
        msg.textContent=`止められた。1on1 ${attack} ＜ 守備${defense}`;
        counterAttack();
        resetAttackOnly();
      }
    }else{
      attackLog.push(`${p.n} ドリブル`);
      showJudge("DRIBBLE","移動");
      msg.textContent=`${p.n}がV${p.spd}でドリブル。`;
      supportMoveAfterDribble();
      defenseMove("ball");
    }
  }else{
    attackLog.push(`${p.n} オフボール移動`);
    showJudge("MOVE","味方移動");
    msg.textContent=`${p.n}を動かした。守備も少し反応します。`;
    defenseMove("offball",p);
  }
  draw();
}

function supportMoveAfterDribble(){
  const ball=players[owner];

  players.forEach((p,i)=>{
    if(i===owner)return;

    if(p.role==="左サイド"){
      p.x=clamp(p.x+1.6,6,84);
      p.y=clamp(p.y-1.2,10,90);
    }

    if(p.role==="右サイド"){
      p.x=clamp(p.x+1.6,6,84);
      p.y=clamp(p.y+1.2,10,90);
    }

    if(p.role==="ミドル"){
      p.x=clamp(p.x+(ball.x+10-p.x)*0.10,6,84);
      p.y=clamp(p.y+(ball.y-p.y)*0.08,10,90);
    }

    if(p.role==="フィニッシャー") return;

    if(p.role==="司令塔"){
      p.x=clamp(p.x-0.3,6,84);
      p.y=clamp(p.y+(50-p.y)*0.04,10,90);
    }
  });
}

function shotScore(){
  const p=players[owner],goal={x:96,y:50};
  const distancePenalty=Math.floor(dist(p,goal)/6);
  const contactDef=marks(p).reduce((s,e)=>s+e.def,0);
  const courseDef=Math.floor(lineDef(p,goal)*0.5);
  const keeper=enemies.find(e=>e.role==="keeper").def;
  return p.shoot-distancePenalty-contactDef-courseDef-keeper;
}

function updateShootButton(){
  shootBtn.classList.remove("shot-high","shot-mid");
  const chance=shotScore();
  if(chance>=4)shootBtn.classList.add("shot-high");
  else if(chance>=0)shootBtn.classList.add("shot-mid");
}

function shoot(){
  const p=players[owner],goal={x:96,y:50};
  const randomBonus=rand(-2,2);
  const distancePenalty=Math.floor(dist(p,goal)/6);
  const contactDef=marks(p).reduce((s,e)=>s+e.def,0);
  const courseDef=Math.floor(lineDef(p,goal)*0.5);
  const keeper=enemies.find(e=>e.role==="keeper").def;
  const result=p.shoot+randomBonus-distancePenalty-contactDef-courseDef-keeper;
  turn++;

  if(result>=0){
    score++;
    attackLog.push(`${p.n} シュート成功`);
    showJudge("SHOT SUCCESS","ゴール");
    msg.textContent=`ゴール！ ${p.n}：S${p.shoot}+補正${randomBonus}-距離${distancePenalty}-接触${contactDef}-コース${courseDef}-GK${keeper} = ${result}`;
    showAttackLog("ゴールまでの流れ");
    resetAttackOnly();
  }else{
    attackLog.push(`${p.n} シュート失敗`);
    showJudge("SHOT FAILED","シュート失敗");
    msg.textContent=`失敗。${p.n}：S${p.shoot}+補正${randomBonus}-距離${distancePenalty}-接触${contactDef}-コース${courseDef}-GK${keeper} = ${result}`;
    counterAttack();
    resetAttackOnly();
  }
  draw();
}

function counterAttack(){
  const enemyPower=rand(10,22)+Math.floor(enemies.reduce((s,e)=>s+e.def,0)/9);
  const ourDefense=rand(11,23)+Math.floor(players.reduce((s,p)=>s+p.one+p.spd,0)/17);

  if(enemyPower>ourDefense){
    showJudge("COUNTER GOAL","カウンター失点");
    msg.textContent+=` / カウンター失点：敵${enemyPower} ＞ 味方守備${ourDefense}`;
  }else{
    showJudge("COUNTER STOP","カウンター阻止");
    msg.textContent+=` / カウンター阻止：敵${enemyPower} ≤ 味方守備${ourDefense}`;
  }
  showAttackLog("今回の攻撃");
}

function showAttackLog(title){
  logBox.innerHTML=`<b>${title}</b><br>`+
    (attackLog.length?attackLog.map((x,i)=>`${i+1}. ${x}`).join("<br>"):"記録なし");
}

function mostDangerousRunner(){
  return players
    .map((p,i)=>({p,i}))
    .filter(x=>x.i!==owner && x.p.x>62)
    .sort((a,b)=>(b.p.x-a.p.x)+Math.abs(50-a.p.y)*-0.05)[0]?.p;
}

function defenseMove(mode="ball",movedPlayer=null){
  const ball=players[owner];
  const runner=mostDangerousRunner();
  const dangerArea=ball.x>65;

  enemies.forEach(e=>{
    if(e.role==="keeper"){
      e.x=clamp(89+(ball.x-70)*0.08,86,92);
      e.y=clamp(50+(ball.y-50)*0.35,34,66);
      return;
    }

    let tx=e.homeX,ty=e.homeY,react=0.24;

    if(e.role==="dmf"){
      tx=e.homeX*0.38+ball.x*0.62;
      ty=e.homeY*0.38+ball.y*0.62;
      react=mode==="ball"?0.34:0.20;

      if(mode==="offball"&&movedPlayer){
        const isMidThreat=movedPlayer.x>38&&movedPlayer.x<72;
        if(isMidThreat){
          tx=tx*0.58+movedPlayer.x*0.42;
          ty=ty*0.58+movedPlayer.y*0.42;
          react=0.30;
        }
      }
    }

    if(e.role==="lcb"){
      tx=60;ty=ball.y<50?38:34;

      if(runner&&runner.y<55){
        tx=tx*0.82+runner.x*0.18;
        ty=ty*0.82+runner.y*0.18;
      }

      if(dangerArea&&ball.y<50){
        tx=ball.x;ty=ball.y;react=0.42;
      }else{
        react=mode==="offball"?0.15:0.25;
      }
    }

    if(e.role==="rcb"){
      tx=60;ty=ball.y>50?62:66;

      if(runner&&runner.y>45){
        tx=tx*0.82+runner.x*0.18;
        ty=ty*0.82+runner.y*0.18;
      }

      if(dangerArea&&ball.y>=50){
        tx=ball.x;ty=ball.y;react=0.42;
      }else{
        react=mode==="offball"?0.15:0.25;
      }
    }

    if(e.role==="sw"){
      tx=75;ty=(ball.y+50)/2;

      if(runner){
        tx=tx*0.70+runner.x*0.30;
        ty=ty*0.70+runner.y*0.30;
      }

      if(dangerArea){
        tx=ball.x+5;
        ty=ball.y*0.35+50*0.65;
        react=0.28;
      }else{
        react=mode==="offball"?0.16:0.26;
      }
    }

    if(movedPlayer&&movedPlayer.x>65){
      tx=tx*0.92+movedPlayer.x*0.08;
      ty=ty*0.92+movedPlayer.y*0.08;
    }

    e.x+=(tx-e.x)*react;
    e.y+=(ty-e.y)*react;
    e.x=clamp(e.x,8,88);
    e.y=clamp(e.y,8,92);
  });
}

function showJudge(main,sub){
  judge.innerHTML=`${main}<br><small>${sub}</small>`;
  judge.style.display="block";
  clearTimeout(showJudge.timer);
  showJudge.timer=setTimeout(()=>judge.style.display="none",1000);
}

function draw(){
  field.querySelectorAll(".player,.enemy,.circle,.zone").forEach(e=>e.remove());
  svg.innerHTML="";

  targetBox.innerHTML=players.map((p,i)=>
    `<button class="${i===selected?'active':''}" onclick="selected=${i};draw()">選択 ${p.n}</button>`
  ).join("");

  for(let i=0;i<5;i++){
    const z=document.createElement("div");
    z.className="zone";
    z.style.left=(i*20)+"%";
    field.appendChild(z);
  }

  enemies.forEach(e=>{
    const c=document.createElement("div");
    c.className="circle";
    c.style.left=e.x+"%";
    c.style.top=e.y+"%";
    c.style.width=e.r*2+"%";
    c.style.aspectRatio="1";
    field.appendChild(c);

    const b=document.createElement("div");
    b.className="enemy";
    b.style.left=e.x+"%";
    b.style.top=e.y+"%";
    b.textContent=e.role==="keeper" ? "GK"+e.def : e.def;
    field.appendChild(b);
  });

  players.forEach((p,i)=>{
    if(i!==owner){
      const l=document.createElementNS("http://www.w3.org/2000/svg","line");
      l.setAttribute("x1",players[owner].x+"%");
      l.setAttribute("y1",players[owner].y+"%");
      l.setAttribute("x2",p.x+"%");
      l.setAttribute("y2",p.y+"%");
      l.setAttribute("stroke",passColor(players[owner],p));
      l.setAttribute("stroke-width","4");
      svg.appendChild(l);
    }
  });

  players.forEach((p,i)=>{
    const el=document.createElement("button");
    el.className="player "+(i===owner?"owner ":"")+(i===selected?"selected":"");
    el.style.left=p.x+"%";
    el.style.top=p.y+"%";
    el.textContent=p.n;
    el.onclick=()=>passTo(i);
    field.appendChild(el);
  });

  status.innerHTML=
    `得点：${score}　ターン：${turn}　ボール保持：${players[owner].n} ${players[owner].role}　選択中：${players[selected].n}<br>`+
    `緑=安全パス / 黄=注意 / 赤=危険　シュートボタン：緑=好機 / 黄=狙える / 通常=まだ早い`;

  roster.innerHTML=players.map(p=>
    `<div class="card"><b>${p.n} ${p.role}</b><br>P${p.pass} / S${p.shoot} / O${p.one} / V${p.spd}</div>`
  ).join("")+
  `<div class="card"><b>GK</b><br>守備 ${enemies.find(e=>e.role==="keeper").def}</div>`;

  updateShootButton();
}

createTeam();
createEnemies();
resetMatch();
</script>
</body>
</html>
